/* ----- week nav + carry ----- */
function stepWeek(dir){
  const next=addDays(ui.weekKey, dir*7);
  ui.weekKey=next; ensureWeek(next);
  if(ui.dayIdx!=='F' && Number(ui.dayIdx)>6) ui.dayIdx=0;
  saveDB();
  viewTransition(render);
}
function doCarry(){
  const from=curWeek(); const to=ensureWeek(todayMonday);
  let moved=0;
  from.days.forEach((d,di)=>{
    ['personal','work'].forEach(kind=>{
      for(let i=d[kind].length-1;i>=0;i--){
        const t=d[kind][i];
        if(!t.done){ t.defers=(t.defers||0)+1; to.days[di][kind].push(t); d[kind].splice(i,1); moved++; }
      }
    });
  });
  // weekend + unscheduled pool carry too — nothing gets stranded in an old week
  ['weekend','future'].forEach(zone=>{
    if(!from[zone]) return;
    ['personal','work'].forEach(kind=>{
      for(let i=from[zone][kind].length-1;i>=0;i--){
        const t=from[zone][kind][i];
        if(!t.done){ t.defers=(t.defers||0)+1; to[zone][kind].push(t); from[zone][kind].splice(i,1); moved++; }
      }
    });
  });
  saveDB();
  ui.weekKey=todayMonday;
  flashToast(`Moved ${moved} task${moved!==1?'s':''} to this week`);
  viewTransition(render);
}
// current week → next week's w/c pool (unfinished days + weekend + pool), deliberate, never automatic
function doCarryNext(){
  const from=curWeek(); const nx=addDays(from.key,7);
  const n=unfinishedCount(from); if(!n) return;
  const [ny,nm,nd]=nx.split('-').map(Number);
  openDialog(`<h3>Carry to next week?</h3><p><b>${n}</b> unfinished task${n!==1?'s':''} will move to the <b>w/c ${nd} ${MON[nm-1]}</b> Unscheduled list for Sunday sorting. Ticked tasks stay put. Nothing is deleted.</p>
    <div class="acts"><button class="cancel" data-x="no">Cancel</button><button class="save" data-x="yes">Carry ${n} forward</button></div>`);
  dlg.querySelector('[data-x=no]').addEventListener('click',closeDialog);
  dlg.querySelector('[data-x=yes]').addEventListener('click',()=>{
    closeDialog();
    const to=ensureWeek(nx); let moved=0;
    from.days.forEach(d=>{
      ['personal','work'].forEach(kind=>{
        for(let i=d[kind].length-1;i>=0;i--){ const t=d[kind][i]; if(!t.done){ t.defers=(t.defers||0)+1; to.future[kind].push(t); d[kind].splice(i,1); moved++; } }
      });
    });
    ['weekend','future'].forEach(zone=>{
      if(!from[zone]) return;
      ['personal','work'].forEach(kind=>{
        for(let i=from[zone][kind].length-1;i>=0;i--){ const t=from[zone][kind][i]; if(!t.done){ t.defers=(t.defers||0)+1; to.future[kind].push(t); from[zone][kind].splice(i,1); moved++; } }
      });
    });
    saveDB(); ui.weekKey=nx;
    flashToast(`Carried ${moved} → w/c ${nd} ${MON[nm-1]} Future — now viewing that week`);
    viewTransition(render);
  });
}
// EVERY unfinished task left in weeks before the current one — days, weekend and Future lanes.
// Display-only aggregation: nothing moves until the user acts on a task.
function pastUnfinishedAll(){
  const out=[];
  Object.keys(DB.weeks).filter(k=>k<todayMonday).sort().forEach(k=>{
    const wk=DB.weeks[k]; if(!wk||!Array.isArray(wk.days)) return;
    wk.days.forEach((d,di)=>['personal','work'].forEach(kind=>(d[kind]||[]).forEach(t=>{ if(!t.done) out.push({wk,di,kind,t}); })));
    ['future','weekend'].forEach(zone=>{ if(!wk[zone]) return; ['personal','work'].forEach(kind=>wk[zone][kind].forEach(t=>{ if(!t.done) out.push({wk,di:zone==='future'?'F':'W',kind,t}); })); });
  });
  return out;
}
function wcShort(k){ const [y,m,d]=k.split('-').map(Number); return d+' '+MON[m-1]; }
// the standing overdue column for Week / Week+ — shown only on the current week, only when non-empty
function overdueColHTML(extraCls){
  if(ui.weekKey!==todayMonday) return '';
  const items=pastUnfinishedAll(); if(!items.length) return '';
  const rows=items.map(x=>taskRow(x.t,{w:x.wk.key,d:x.di},{grip:true, tag:'w/c '+wcShort(x.wk.key), nomini:true})).join('');   /* v2.2: the cross-week aggregate stays dense — no compact sub lists here, matching the phone Late view */
  return `<div class="col late ${extraCls||''}"><div class="colhead"><span class="dw">Not done</span><span class="nn">past weeks · ${items.length}</span><button class="addmini warn" data-act="pullpools" title="move all into this week's Future for sorting" aria-label="move every overdue task into this week's Future">⇪ all</button></div>${rows?`<div class="list latelist">${rows}</div>`:''}</div>`;
}
function doPullPools(){
  const s=pastUnfinishedAll(); if(!s.length) return;
  const oldest=s.map(x=>x.wk.key).sort()[0];
  openConfirm('Move all overdue in?',
    `<b>${s.length}</b> unfinished task${s.length!==1?'s':''} from past weeks (back to w/c ${wcShort(oldest)}) will move into this week's Unscheduled list for sorting. Nothing is deleted, ticked tasks stay where they are.`,
    `Move ${s.length} in`, ()=>{
      const to=ensureWeek(ui.weekKey>=todayMonday?ui.weekKey:todayMonday);
      s.forEach(({wk,di,kind,t})=>{ const arr=colArr(wk,di,kind); const i=arr.indexOf(t); if(i>=0){ arr.splice(i,1); t.defers=(t.defers||0)+1; to.future[kind].push(t); } });
      saveDB(); flashToast(`Moved ${s.length} overdue task${s.length!==1?'s':''} into this week's Future`);
      render();
    });
}

    const wk=DB.weeks[k]; if(!wk||!Array.isArray(wk.days)) return;

let dragging=false;
document.addEventListener('pointerdown', e=>{
  const grip=e.target.closest('.grip'); if(!grip || !isLap()) return;
  e.preventDefault();
  const row=grip.closest('.t'); const ctx=findTask(row); if(!ctx) return;
  dragging=true; row.classList.add('dragging');
  /* v2.2: the row's sub blocks stay behind during a live drag — hide them until a render heals the DOM (every up() path renders) */
  { let sib=row.nextElementSibling; while(sib && (sib.classList.contains('subs')||sib.classList.contains('subsmini'))){ sib.classList.add('drag-hidden'); sib=sib.nextElementSibling; } }
  const srcArr=ctx.arr, srcObj=ctx.t;
  /* Where a release actually lands. Anywhere inside a column counts — its header, a lane
     label, the gap between lanes — because that is plainly what was aimed at. Outside every
     column is not a drop at all, and the Not-done column has no data-bearing lane so it stays
     undroppable. Previously a release over a header or over blank page committed the task to
     whichever list the cursor had last crossed on the way, with no toast. */
  function resolveTarget(x,y){
    const el=document.elementFromPoint(x,y); if(!el) return null;
    const L=el.closest('.list'); if(L) return laneFor(L);
    const col=el.closest('.col'); if(!col) return null;
    const any=col.querySelector('.list[data-w][data-k]');
    return any ? laneFor(any) : null;
  }
  /* v1.2 (E2): the COLUMN under the pointer is the target, never the lane.
     Dragging a work task out of a long Future column crosses Personal on the way,
     and releasing there used to silently re-label it. Now it snaps to its own lane
     in whichever column the pointer is over — visible while dragging, not just on
     release. Re-laning moved to the Edit dialog, where it is deliberate. */
  function laneFor(L){
    if(!L) return null;
    if(L.dataset.k===srcObj.kind) return L;
    if(!L.dataset.w || L.dataset.d===undefined) return null;
    const sel='.list[data-w="'+L.dataset.w+'"][data-d="'+L.dataset.d+'"][data-k="'+srcObj.kind+'"]';
    const scope=L.closest('.col');
    return (scope&&scope.querySelector(sel)) || document.querySelector(sel);
  }
  function move(ev){
    const L=resolveTarget(ev.clientX,ev.clientY)||row.parentNode;
    const others=[...L.querySelectorAll('.t:not(.dragging)')];
    const after=others.find(r=>{ const b=r.getBoundingClientRect(); return ev.clientY < b.top+b.height/2; });
    if(after) L.insertBefore(row,after); else L.appendChild(row);
  }
  function up(ev){
    const tgt=(ev && typeof ev.clientX==='number') ? resolveTarget(ev.clientX,ev.clientY) : null;
    dragging=false; row.classList.remove('dragging');
    window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
    if(!tgt){ render(); return; }   // released outside any column — put it back, touch nothing
    const wk=DB.weeks[tgt.dataset.w] || (/^\d{4}-\d{2}-\d{2}$/.test(tgt.dataset.w||'') ? ensureWeek(tgt.dataset.w) : null);
    const di=(tgt.dataset.d==='F'||tgt.dataset.d==='W')?tgt.dataset.d:Number(tgt.dataset.d); const kind=tgt.dataset.k;
    if(!wk || !tgt.dataset.w || (kind!=='personal' && kind!=='work')){ render(); return; }   // dropped somewhere that isn't a real lane (e.g. the overdue list) — put it back, touch nothing
    if(kind!==srcObj.kind){ render(); return; }               // lane lock: a drag never re-labels a task. Fails safe — no move at all rather than a wrong one
    // if a cloud adoption swapped the data out mid-drag, our captured task object is stale — inserting it would resurrect a duplicate
    const still=findTask(row); if(!still || still.t!==srcObj){ render(); return; }
    const sPos=srcArr.indexOf(srcObj); if(sPos>=0) srcArr.splice(sPos,1);
    if(wk && ctx.wk && wk.key>ctx.wk.key) srcObj.defers=(srcObj.defers||0)+1;   // cross-week drag counts as a defer, same as every other move route
    const tgtArr=colArr(wk,di,kind);
    let newIdx=[...tgt.querySelectorAll('.t')].indexOf(row); if(newIdx<0)newIdx=tgtArr.length;
    // account for timed-sort: just push then sort handled on render
    tgtArr.splice(newIdx,0,srcObj);
    saveDB(); render();
    /* v2.2: confirm the drop visibly — sortTimed can relocate the row, the flash lets the eye re-acquire it */
    requestAnimationFrame(()=>{ const el=document.querySelector('.t[data-id="'+srcObj.id+'"]'); if(el){ el.classList.add('dropflash'); setTimeout(()=>{ el.classList.remove('dropflash'); }, 500); } });
  }
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);   /* v2.2: a cancelled stream must not latch `dragging` */
});

/* long-press (any device) or right-click (laptop) on a task → move sheet */

document.addEventListener('pointerup', ()=>{ if(_lpT){ clearTimeout(_lpT); _lpT=null; } });

/* ---------- v1.2 (E3): date rollover on a page left open ----------
   Recompute on a timer and whenever the window is focused. A redraw is deferred
   while a dialog is open or a drag is in flight, so nothing typed is thrown away;
   the deferred redraw is applied as soon as the way is clear. */
let _dateDeferred=false;
function dateChanged(){
  const nISO = computeTodayISO();
  if(nISO === todayISO) return false;
  const oldMonday = todayMonday, oldIdx = todayDayIdx();
  todayISO = nISO;
  todayMonday = isoMonday(new Date());
  if(ui.weekKey === oldMonday) ui.weekKey = todayMonday;     // follow the week over a Sun→Mon boundary
  if(ui.dayIdx === oldIdx) ui.dayIdx = todayDayIdx();        // only if it was tracking today, never a day he chose
  return true;
}
function dateTick(){
  if(dateChanged()) _dateDeferred = true;
  if(!_dateDeferred) return;
  if(dragging) return;                                        // mid-drag: the DOM is being moved about
  if(dlg && dlg.open) return;                                 // mid-edit: never bin what he has typed
  _dateDeferred = false;
  /* No applyRecurringFrom — it dedupes only against the exact target day, so re-running it
     duplicates any instance the user moved and resurrects any he deleted.
     And deliberately NO saveDB. An unattended save here bumps savedAt
     with no user action, and both sync arbitrators then read this device as the newest
     copy: the pull skips adopting (rSaved<=lSaved) and the push takes over on a 412 with
     If-Match:null. Measured: the phone's whole evening of edits erased under a green
     Synced badge, every Monday. Creating without saving is exactly what a page refresh
     has always done — if the counts diverge the app raises "Two copies found", which is
     loud and non-destructive. Loud beats silent. */
  if(!DB.weeks[todayMonday]) ensureWeek(todayMonday);
  render();
}
function watchDate(){
  setInterval(dateTick, 60000);
  window.addEventListener('focus', dateTick);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) dateTick(); });
  document.addEventListener('close', dateTick, true);         // a dialog closing releases a deferred redraw
}

/* relayout on breakpoint cross — multiple triggers so the swap is always reliable */
let _wasLap=null;
function relayoutIfCrossed(){ const n=isLap(); if(n!==_wasLap){ _wasLap=n; render(); } }
function watchLayout(){
  _wasLap=isLap();
  // matchMedia fires reliably on real viewport breakpoint crossings (drag-resize)
  try{ const mq=matchMedia('(min-width:820px)'); mq.addEventListener? mq.addEventListener('change',relayoutIfCrossed) : mq.addListener(relayoutIfCrossed); }catch(e){}
  // debounced resize backup
  let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(relayoutIfCrossed,140); });
  // ResizeObserver on #frame (covers container-width changes; harmless if it never fires)
  const f=document.getElementById('frame'); if(f && 'ResizeObserver' in window){ try{ new ResizeObserver(relayoutIfCrossed).observe(f); }catch(e){} }
}

/* ============================================================
   CLAUDE BACKEND — the app talks to Claude directly.
   In this design lab: window.claude.complete (built in, no key).
   On the live site: a ~20-line Cloudflare worker (same pattern as the
   Fitbit proxy) holds the API key — set CLAUDE_PROXY_URL and nothing
   else changes. All features are on-demand and CONFIRM-BEFORE-WRITE:
   Claude proposes, only you apply. A failure never breaks the planner.
   ============================================================ */
const CLAUDE_PROXY_URL='';   // e.g. 'https://claude-proxy.tom-f71.workers.dev' once deployed
function claudeBackend(){ if(window.claude && window.claude.complete) return 'lab'; if(CLAUDE_PROXY_URL) return 'worker'; return null; }
async function askClaude(system, user, maxTokens){
  const be=claudeBackend(); if(!be) throw new Error('no Claude backend configured');
  if(be==='lab') return await window.claude.complete({ system, messages:[{role:'user',content:user}], max_tokens:maxTokens||800 });
  const r=await fetch(CLAUDE_PROXY_URL,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ system, user, max_tokens:maxTokens||800 }) });
  if(!r.ok) throw new Error('Claude proxy '+r.status);
  const j=await r.json(); return j.text||j.completion||'';
}
function extractJSON(s){ const m=(''+s).match(/\{[\s\S]*\}/); if(!m) throw new Error('no JSON in reply'); return JSON.parse(m[0]); }
function mdLite(s){
  // escape first, then convert the markdown models emit anyway: **b**, *i*, `c`, # headers, - bullets
  let h=esc((''+s).trim());
  h=h.replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>');
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/__([^_\n]+)__/g,'<b>$1</b>');
  h=h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>').replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>');
  h=h.replace(/`([^`\n]+)`/g,'$1');
  h=h.replace(/^\s*[-•]\s+/gm,'· ');
  h=h.replace(/\*/g,'');  // any stragglers
  return h;
}

/* ----- HEALTH: Fitbit / Google Health behind ONE adapter; gap-tolerant ----- */
const SLEEP_TARGET=480, STEP_GOAL=10000;
/* ---- FITBIT (direct, client-side): Implicit Grant, no secret, no relay worker. Token lifetime

    <div class="dayhead"><div><div class="dow" style="font-size:23px">${esc(p.name)}</div><div class="date">${esc(p.goal||'')}</div></div></div>
    <div class="projfeat flat" style="--pc:${p.color}">
      <div class="pf-bar"><div class="pf-fill" style="width:${pr.pct}%"></div></div>
      <div class="pf-meta"><span>${pr.done}/${pr.total} steps done · ${pr.pct}%</span>${p.due?`<span>${dueCountdown(p.due)}</span>`:''}</div>
    </div>
    ${p.claude?`<div class="claudebar"><span class="pill claude">✶ Claude</span><span style="flex:1">Claude can break this down and push the next steps into your week.</span><button class="linkbtn" data-act="claude-fill" data-pid="${p.id}">Plan next →</button></div>`:''}
    <div class="eyebrow">The trail<span class="ln"></span></div>
    <div class="list">${steps||'<div class="empty" style="padding:18px"><div class="s">No steps yet — add the first below.</div></div>'}</div>
    <button class="showfull" data-act="addstep" data-pid="${p.id}" style="margin-top:12px">＋ Add a step</button>
    ${isLap()?'</div>':''}`;
}

function renderReminders(){
  const wrap=isLap()?'<div class="lapwrap" style="max-width:760px">':'';
  const rem=allReminders(); const now=new Date();
  const over=rem.filter(x=>new Date(x.t.remind)<now);
  const today=rem.filter(x=>{const d=new Date(x.t.remind); return d>=now && d.toDateString()===now.toDateString();});
  const up=rem.filter(x=>{const d=new Date(x.t.remind); return d>now && d.toDateString()!==now.toDateString();});
  const grp=(title,arr,cls)=>arr.length?`<div class="eyebrow ${cls}">${title} · ${arr.length}<span class="ln"></span></div>`+arr.map(remRow).join(''):'';
  view.innerHTML = wrap + `
    <div class="dayhead"><div><div class="dow" style="font-size:26px">Reminders</div><div class="date">nudges for the things that slip</div></div></div>
    ${notifyState()}
    ${rem.length? grp('Overdue',over,'')+grp('Today',today,'p')+grp('Coming up',up,'w') : `<div class="empty"><div class="ic">🔔</div><div class="h">No reminders set.</div><div class="s">Open any task → “Remind me” to add one.</div></div>`}
    ${isLap()?'</div>':''}`;
}
function remRow(x){ const over=new Date(x.t.remind)<new Date(); return `<div class="remrow ${over?'over':''} ${x.t.kind==='work'?'kwork':''}" data-w="${x.wk.key}" data-d="${x.di}" data-k="${x.t.kind}" data-id="${x.t.id}">
    <div class="remmain"><div class="remlab">${esc(x.t.label)}</div><div class="remtime">⏰ ${fmtRemindFull(x.t.remind)}</div></div>
    <div class="remacts"><button data-act="rem-done" title="Done">✓</button><button data-act="rem-snooze" title="Snooze a day">+1d</button><button data-act="rem-clear" title="Clear">✕</button></div></div>`; }
function notifyState(){ if(!('Notification'in window)) return `<div class="hintcard">In-app reminders work now. Push to a locked phone needs the wiring step (Web Push + the sync server) — flagged in the plan.</div>`; if(Notification.permission==='granted') return `<div class="hintcard ok">✓ Notifications on — reminders ping while the planner's open. Background push to a locked phone comes with the wiring step.</div>`; if(Notification.permission==='denied') return `<div class="hintcard">Notifications are blocked in browser settings. In-app reminders still work here.</div>`; return `<button class="showfull" data-act="enable-notify" style="margin-bottom:4px">🔔 Turn on notifications</button>`; }
function requestNotify(){ if(!('Notification'in window)){ flashToast('No notifications in this browser'); return; } try{ Notification.requestPermission().then(()=>renderReminders()); }catch(e){ renderReminders(); } }

function renderShopping(){
  const wrap=isLap()?'<div class="lapwrap" style="max-width:680px">':'';
  const items=DB.shopping||[]; const doneN=items.filter(i=>i.done).length;
  view.innerHTML = wrap + `
    <div class="dayhead"><div><div class="dow" style="font-size:26px">Shopping</div><div class="date">dictate or type — one running list</div></div></div>
    <div class="shopadd"><input id="shopinput" placeholder="Add item…  (tap the mic to dictate)" enterkeyhint="done" autocomplete="off" autocapitalize="sentences"/><button class="addgo" data-act="shop-add" aria-label="add">+</button></div>
    ${items.length?`<div class="list" style="margin-top:12px">${items.map((it,i)=>`<div class="t ${it.done?'done':''}"><button class="check ${it.done?'done':''}" data-act="shop-toggle" data-si="${i}">${CHK}</button><span class="lab">${esc(it.label)}</span><button class="chev" data-act="shop-del" data-si="${i}" aria-label="remove">✕</button></div>`).join('')}</div>${doneN?`<button class="showfull" data-act="shop-clear" style="margin-top:12px">Clear ${doneN} ticked</button>`:''}`:`<div class="empty"><div class="ic">🛒</div><div class="h">List's empty.</div><div class="s">Add the first thing above — talk or type.</div></div>`}
    ${isLap()?'</div>':''}`;
}
function shopAdd(){ const inp=document.getElementById('shopinput'); if(!inp)return; const v=inp.value.trim(); if(!v)return; (DB.shopping=DB.shopping||[]).push({id:uid(),label:v,done:false}); inp.value=''; saveDB(); renderShopping(); const ni=document.getElementById('shopinput'); if(ni)ni.focus(); }
function openNewProject(){
  openDialog(`<h3>New project</h3><p>A bigger goal Claude can break into day-tasks.</p>
    <label>Name</label><input id="p-name" placeholder="e.g. Málaga move" enterkeyhint="done"/>
    <label>Why it matters · optional</label><input id="p-goal" placeholder="The outcome you're driving toward"/>
    <label>Target date · optional</label><input id="p-due" type="date"/>
    <label class="chk"><input type="checkbox" id="p-claude" checked> Claude helps run this</label>
    <div class="acts"><button class="cancel" data-x="cancel">Cancel</button><button class="save" data-x="save">Create</button></div>`);
  dlg.querySelector('[data-x="cancel"]').addEventListener('click',closeDialog);
  dlg.querySelector('[data-x="save"]').addEventListener('click',()=>{ const name=dlg.querySelector('#p-name').value.trim(); if(!name){closeDialog();return;} const id='p'+Date.now().toString(36); const colors=['#bd5f37','#557785','#4e8a5a','#7a5c8e','#b78a3a']; DB.projects.push({id,name,goal:dlg.querySelector('#p-goal').value.trim(),due:dlg.querySelector('#p-due').value||null,color:colors[DB.projects.length%colors.length],claude:dlg.querySelector('#p-claude').checked}); saveDB(); ui.projectId=id; closeDialog(); go('project'); });
}
function openAddStep(pid){
  const p=getProject(pid);
  openDialog(`<h3>Add a step</h3><p>Adds a task to ${esc(p?p.name:'the project')}. Lands in Future — give it a day from the task itself.</p>
    <input id="s-label" placeholder="One concrete step…" enterkeyhint="done"/>
    <label>Lane</label><div class="chiprow" id="s-kind"><button type="button" class="dchip on" data-sk="personal">Personal</button><button type="button" class="dchip" data-sk="work">Work</button></div>
    <label>Do this in Claude?</label><div class="chiprow" id="s-claude"><button type="button" class="dchip on" data-cm="">Off</button><button type="button" class="dchip" data-cm="prompt">Prompt</button><button type="button" class="dchip" data-cm="workflow">Workflow</button><button type="button" class="dchip" data-cm="cowork">Cowork</button><button type="button" class="dchip" data-cm="code">Code</button></div>
    <div class="acts"><button class="cancel" data-x="cancel">Cancel</button><button class="save" data-x="save">Add step</button></div>`);
  dlg.querySelector('#s-kind').addEventListener('click',e=>{const b=e.target.closest('[data-sk]');if(!b)return;dlg.querySelectorAll('#s-kind .dchip').forEach(x=>x.classList.toggle('on',x===b));});
  dlg.querySelector('#s-claude').addEventListener('click',e=>{const b=e.target.closest('[data-cm]');if(!b)return;dlg.querySelectorAll('#s-claude .dchip').forEach(x=>x.classList.toggle('on',x===b));});
  dlg.querySelector('[data-x="cancel"]').addEventListener('click',closeDialog);
  const done=()=>{ const v=dlg.querySelector('#s-label').value.trim(); if(v){ const cm=dlg.querySelector('#s-claude .dchip.on')?.dataset.cm||null; const sk=dlg.querySelector('#s-kind .dchip.on')?.dataset.sk||'personal'; const wk=ensureWeek(todayMonday); wk.future[sk].push(T(v,sk,{projectId:pid,claude:cm})); saveDB(); renderProjectDetail(pid); } closeDialog(); };
  dlg.querySelector('[data-x="save"]').addEventListener('click',done);
  dlg.querySelector('#s-label').addEventListener('keydown',e=>{ if(e.key==='Enter')done(); });
}
function claudeFill(pid){
  const ts=allProjectTasks(pid).filter(x=>!x.t.done && x.di==='F'); if(!ts.length){ claudeProposeSteps(pid); return; }
  const wk=ensureWeek(todayMonday); let di=todayDayIdx(), moved=0;
  ts.slice(0,3).forEach(x=>{ const arr=x.wk.future[x.kind]; const pos=arr.indexOf(x.t); if(pos>=0)arr.splice(pos,1); wk.days[Math.min(di,6)][x.kind].push(x.t); di++; moved++; });
  saveDB(); flashToast(`Claude scheduled ${moved} step${moved!==1?'s':''} into your week`); renderProjectDetail(pid);
}

/* reminder due-check: in-app while open (background push needs the wiring step) */
const _notified={};
function primeReminders(){ const now=Date.now(); allReminders().forEach(x=>{ if(new Date(x.t.remind).getTime()<=now) _notified[x.t.id]=1; }); }
function checkReminders(){ const now=Date.now(); let fired=false; allReminders().forEach(x=>{ const ts=new Date(x.t.remind).getTime(); if(ts<=now && !_notified[x.t.id]){ _notified[x.t.id]=1; fired=true; if(('Notification'in window)&&Notification.permission==='granted'){ try{ new Notification('Planner reminder',{body:x.t.label}); }catch(e){ flashToast('⏰ '+x.t.label); } } else { flashToast('⏰ '+x.t.label); } } }); if(fired && ui.view==='today') renderToday(); }

/* ---------- boot ---------- */
DB=loadDB();
// Web Share Target: text shared from iOS lands in the brain-dump inbox
(function(){ try{ const p=new URLSearchParams(location.search); if(!p.get('code')&&!p.get('error')){ const shared=[p.get('text'),p.get('title'),p.get('url')].filter(Boolean).join(' ').trim(); if(shared){ DB.inbox=DB.inbox||[]; DB.inbox.unshift({label:shared}); window.__sharedBoot=true; try{ saveLocalOnly(); }catch(e){} try{ history.replaceState({},'',location.pathname); }catch(e){} }   /* v2.2: a shared thought is persisted the moment it lands (rev-inert) — it can no longer die in memory */ } }catch(e){} })();
try{ loadCalCache(); }catch(e){}
render();
try{ initOneDrive(); }catch(e){}
setTimeout(maybeOfferRecurCatchup, 900);   // v2.0 (E0): one-time offer, user decides, More has the same action
try{ refreshHealth(); }catch(e){}
watchLayout();
watchDate();
primeReminders();
setInterval(checkReminders, 60000);

// Register the service worker (offline-first). Harmless if unsupported.
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
