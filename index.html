      <div class="pf-bar"><div class="pf-fill" style="width:${pr.pct}%"></div></div>
      <div class="pf-meta"><span>${pr.done}/${pr.total} steps done · ${pr.pct}%</span>${p.due?`<span>${dueCountdown(p.due)}</span>`:''}</div>
    </div>
    ${p.claude?`<div class="claudebar"><span class="pill claude">✶ Claude</span><span style="flex:1">Claude can break this down and push the next steps into your week.</span><button class="linkbtn" data-act="claude-fill" data-pid="${p.id}">Plan next →</button></div>`:''}
    <div class="eyebrow">The trail<span class="ln"></span></div>
    <div class="list">${steps||'<div class="empty" style="padding:18px"><div class="s">No steps yet — add the first below.</div></div>'}</div>
    <button class="showfull" data-act="addstep" data-pid="${p.id}" style="margin-top:12px">＋ Add a step</button>
    ${isLap()?'</div>':''}`;
}

function renderReminders(){
  const wrap=isLap()?'<div class="lapwrap" style="max-width:760px">':'';
  const rem=allReminders(); const now=new Date();
  const over=rem.filter(x=>new Date(x.t.remind)<now);
  const today=rem.filter(x=>{const d=new Date(x.t.remind); return d>=now && d.toDateString()===now.toDateString();});
  const up=rem.filter(x=>{const d=new Date(x.t.remind); return d>now && d.toDateString()!==now.toDateString();});
  const grp=(title,arr,cls)=>arr.length?`<div class="eyebrow ${cls}">${title} · ${arr.length}<span class="ln"></span></div>`+arr.map(remRow).join(''):'';
  view.innerHTML = wrap + `
    <div class="dayhead"><div><div class="dow" style="font-size:26px">Reminders</div><div class="date">nudges for the things that slip</div></div></div>
    ${notifyState()}
    ${rem.length? grp('Overdue',over,'')+grp('Today',today,'p')+grp('Coming up',up,'w') : `<div class="empty"><div class="ic">🔔</div><div class="h">No reminders set.</div><div class="s">Open any task → “Remind me” to add one.</div></div>`}
    ${isLap()?'</div>':''}`;
}
function remRow(x){ const over=new Date(x.t.remind)<new Date(); return `<div class="remrow ${over?'over':''} ${x.t.kind==='work'?'kwork':''}" data-w="${x.wk.key}" data-d="${x.di}" data-k="${x.t.kind}" data-id="${x.t.id}">
    <div class="remmain"><div class="remlab">${esc(x.t.label)}</div><div class="remtime">⏰ ${fmtRemindFull(x.t.remind)}</div></div>
    <div class="remacts"><button data-act="rem-done" title="Done">✓</button><button data-act="rem-snooze" title="Snooze a day">+1d</button><button data-act="rem-clear" title="Clear">✕</button></div></div>`; }
function notifyState(){ if(!('Notification'in window)) return `<div class="hintcard">In-app reminders work now. Push to a locked phone needs the wiring step (Web Push + the sync server) — flagged in the plan.</div>`; if(Notification.permission==='granted') return `<div class="hintcard ok">✓ Notifications on — reminders ping while the planner's open. Background push to a locked phone comes with the wiring step.</div>`; if(Notification.permission==='denied') return `<div class="hintcard">Notifications are blocked in browser settings. In-app reminders still work here.</div>`; return `<button class="showfull" data-act="enable-notify" style="margin-bottom:4px">🔔 Turn on notifications</button>`; }
function requestNotify(){ if(!('Notification'in window)){ flashToast('No notifications in this browser'); return; } try{ Notification.requestPermission().then(()=>renderReminders()); }catch(e){ renderReminders(); } }

function renderShopping(){
  const wrap=isLap()?'<div class="lapwrap" style="max-width:680px">':'';
  const items=DB.shopping||[]; const doneN=items.filter(i=>i.done).length;
  view.innerHTML = wrap + `
    <div class="dayhead"><div><div class="dow" style="font-size:26px">Shopping</div><div class="date">dictate or type — one running list</div></div></div>
    <div class="shopadd"><input id="shopinput" placeholder="Add item…  (tap the mic to dictate)" enterkeyhint="done" autocomplete="off" autocapitalize="sentences"/><button class="addgo" data-act="shop-add" aria-label="add">+</button></div>
    ${items.length?`<div class="list" style="margin-top:12px">${items.map((it,i)=>`<div class="t ${it.done?'done':''}"><button class="check ${it.done?'done':''}" data-act="shop-toggle" data-si="${i}">${CHK}</button><span class="lab">${esc(it.label)}</span><button class="chev" data-act="shop-del" data-si="${i}" aria-label="remove">✕</button></div>`).join('')}</div>${doneN?`<button class="showfull" data-act="shop-clear" style="margin-top:12px">Clear ${doneN} ticked</button>`:''}`:`<div class="empty"><div class="ic">🛒</div><div class="h">List's empty.</div><div class="s">Add the first thing above — talk or type.</div></div>`}
    ${isLap()?'</div>':''}`;
}
function shopAdd(){ const inp=document.getElementById('shopinput'); if(!inp)return; const v=inp.value.trim(); if(!v)return; (DB.shopping=DB.shopping||[]).push({id:uid(),label:v,done:false}); inp.value=''; saveDB(); renderShopping(); const ni=document.getElementById('shopinput'); if(ni)ni.focus(); }
function openNewProject(){
  openDialog(`<h3>New project</h3><p>A bigger goal Claude can break into day-tasks.</p>
    <label>Name</label><input id="p-name" placeholder="e.g. Málaga move" enterkeyhint="done"/>
    <label>Why it matters · optional</label><input id="p-goal" placeholder="The outcome you're driving toward"/>
    <label>Target date · optional</label><input id="p-due" type="date"/>
    <label class="chk"><input type="checkbox" id="p-claude" checked> Claude helps run this</label>
    <div class="acts"><button class="cancel" data-x="cancel">Cancel</button><button class="save" data-x="save">Create</button></div>`);
  dlg.querySelector('[data-x="cancel"]').addEventListener('click',closeDialog);
  dlg.querySelector('[data-x="save"]').addEventListener('click',()=>{ const name=dlg.querySelector('#p-name').value.trim(); if(!name){closeDialog();return;} const id='p'+Date.now().toString(36); const colors=['#bd5f37','#557785','#4e8a5a','#7a5c8e','#b78a3a']; DB.projects.push({id,name,goal:dlg.querySelector('#p-goal').value.trim(),due:dlg.querySelector('#p-due').value||null,color:colors[DB.projects.length%colors.length],claude:dlg.querySelector('#p-claude').checked}); saveDB(); ui.projectId=id; closeDialog(); go('project'); });
}
function openAddStep(pid){
  const p=getProject(pid);
  openDialog(`<h3>Add a step</h3><p>Adds a task to ${esc(p?p.name:'the project')}. Lands in Future — give it a day from the task itself.</p>
    <input id="s-label" placeholder="One concrete step…" enterkeyhint="done"/>
    <label>Lane</label><div class="chiprow" id="s-kind"><button type="button" class="dchip on" data-sk="personal">Personal</button><button type="button" class="dchip" data-sk="work">Work</button></div>
    <label>Do this in Claude?</label><div class="chiprow" id="s-claude"><button type="button" class="dchip on" data-cm="">Off</button><button type="button" class="dchip" data-cm="prompt">Prompt</button><button type="button" class="dchip" data-cm="workflow">Workflow</button><button type="button" class="dchip" data-cm="cowork">Cowork</button><button type="button" class="dchip" data-cm="code">Code</button></div>
    <div class="acts"><button class="cancel" data-x="cancel">Cancel</button><button class="save" data-x="save">Add step</button></div>`);
  dlg.querySelector('#s-kind').addEventListener('click',e=>{const b=e.target.closest('[data-sk]');if(!b)return;dlg.querySelectorAll('#s-kind .dchip').forEach(x=>x.classList.toggle('on',x===b));});
  dlg.querySelector('#s-claude').addEventListener('click',e=>{const b=e.target.closest('[data-cm]');if(!b)return;dlg.querySelectorAll('#s-claude .dchip').forEach(x=>x.classList.toggle('on',x===b));});
  dlg.querySelector('[data-x="cancel"]').addEventListener('click',closeDialog);
  const done=()=>{ const v=dlg.querySelector('#s-label').value.trim(); if(v){ const cm=dlg.querySelector('#s-claude .dchip.on')?.dataset.cm||null; const sk=dlg.querySelector('#s-kind .dchip.on')?.dataset.sk||'personal'; const wk=ensureWeek(todayMonday); wk.future[sk].push(T(v,sk,{projectId:pid,claude:cm})); saveDB(); renderProjectDetail(pid); } closeDialog(); };
  dlg.querySelector('[data-x="save"]').addEventListener('click',done);
  dlg.querySelector('#s-label').addEventListener('keydown',e=>{ if(e.key==='Enter')done(); });
}
function claudeFill(pid){
  const ts=allProjectTasks(pid).filter(x=>!x.t.done && x.di==='F'); if(!ts.length){ claudeProposeSteps(pid); return; }
  const wk=ensureWeek(todayMonday); let di=todayDayIdx(), moved=0;
  ts.slice(0,3).forEach(x=>{ const arr=x.wk.future[x.kind]; const pos=arr.indexOf(x.t); if(pos>=0)arr.splice(pos,1); wk.days[Math.min(di,6)][x.kind].push(x.t); di++; moved++; });
  saveDB(); flashToast(`Claude scheduled ${moved} step${moved!==1?'s':''} into your week`); renderProjectDetail(pid);
}

/* reminder due-check: in-app while open (background push needs the wiring step) */
const _notified={};
function primeReminders(){ const now=Date.now(); allReminders().forEach(x=>{ if(new Date(x.t.remind).getTime()<=now) _notified[x.t.id]=1; }); }
function checkReminders(){ const now=Date.now(); let fired=false; allReminders().forEach(x=>{ const ts=new Date(x.t.remind).getTime(); if(ts<=now && !_notified[x.t.id]){ _notified[x.t.id]=1; fired=true; if(('Notification'in window)&&Notification.permission==='granted'){ try{ new Notification('Planner reminder',{body:x.t.label}); }catch(e){ flashToast('⏰ '+x.t.label); } } else { flashToast('⏰ '+x.t.label); } } }); if(fired && ui.view==='today') renderToday(); }

/* ---------- boot ---------- */
DB=loadDB();
// Web Share Target: text shared from iOS lands in the brain-dump inbox
(function(){ try{ const p=new URLSearchParams(location.search); if(!p.get('code')&&!p.get('error')){ const shared=[p.get('text'),p.get('title'),p.get('url')].filter(Boolean).join(' ').trim(); if(shared){ DB.inbox=DB.inbox||[]; DB.inbox.unshift({label:shared}); try{ history.replaceState({},'',location.pathname); }catch(e){} } } }catch(e){} })();
try{ loadCalCache(); }catch(e){}
render();
try{ initOneDrive(); }catch(e){}
try{ refreshHealth(); }catch(e){}
watchLayout();
primeReminders();
setInterval(checkReminders, 60000);

// Register the service worker (offline-first). Harmless if unsupported.
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
