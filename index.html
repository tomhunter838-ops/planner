:root{ --disp: ui-serif, Georgia, 'Times New Roman', serif; --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color-scheme: light; }
*{ box-sizing:border-box; }
html, body, #root { height: 100%; margin: 0; padding: 0; }
body { background: transparent; }
::-webkit-scrollbar{ height:8px; width:8px; }
::-webkit-scrollbar-thumb{ background:#d8cdb8; border-radius:8px; }
button{ cursor:pointer; font-family:var(--body); border:none; }
input,select,textarea{ font-family:var(--body); }
@media (max-width: 720px) {
  .wp-shopping-cols { flex-direction: column !important; }
  .wp-journal-wrap { flex-direction: column !important; }
  .wp-journal-side { max-width: none !important; width: 100% !important; max-height: 220px !important; }
  .wp-month-day-cell { min-width: 90px !important; }
}
@media (max-width: 400px) {
  .wp-tab-row { flex-wrap: wrap !important; }
  .wp-lane-toggle { flex-wrap: wrap !important; }
  .wp-add-bar > input { min-width: 60% !important; }
  .wp-week-label { font-size: 22px !important; }
}
