<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#f1ebdf" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Planner" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="color-scheme" content="light" />
<title>Weekly Planner</title>
<style>
  :root{
    --bg:#efe8da; --paper:#fcfaf5; --paper-2:#f7f1e6; --ink:#2c2722; --ink-2:#4a4136;
    --muted:#94897a; --faint:#b6ab98; --hair:#e8dfcd; --hair-2:#efe7d6;
    --p:#bd5f37; --p-wash:#f7ece2; --p-line:#e7c7ad;
    --w:#557785; --w-wash:#e9f0f2; --w-line:#c7dbe1;
    --good:#4e8a5a; --good-wash:#e7f0e7;
    --gold:#b78a3a;
    --claude:#7a5c8e; --claude-wash:#efe9f3; --claude-line:#ddcfe7;
    --shadow-1:0 1px 2px rgba(70,52,28,.05);
    --shadow-2:0 2px 4px rgba(70,52,28,.05), 0 10px 26px rgba(70,52,28,.07);
    --shadow-3:0 14px 40px rgba(70,52,28,.16);
    --r:16px; --tabh:64px; --addh:66px;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --ease:cubic-bezier(.4,.0,.2,1);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    color:var(--ink); background:var(--bg); min-height:100dvh;
    background-image:radial-gradient(120% 80% at 50% -10%, #f6f0e4 0%, #efe8da 46%, #e6dcc8 100%);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}
  ::selection{background:#e8d3bf;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ---------- shell ---------- */
  #app{ display:flex; flex-direction:column; min-height:100dvh; }
  #frame{ container-type:inline-size; container-name:app; width:100%; flex:1; display:flex; flex-direction:column; min-width:0; }
  #main{ flex:1; width:100%; }
  .wrap{ width:100%; max-width:680px; margin:0 auto; padding:0 18px; }

  /* ===== PHONE (default) ===== */
  #lapnav{ display:none; }
  /* chrome visibility is viewport-driven (set by JS) so fixed bars stay correct */
  body[data-lay="lap"] #tabbar, body[data-lay="lap"] #addbar{ display:none !important; }
  body[data-lay="lap"] #lapnav{ display:flex; }   /* invariant: lap mode always shows top nav, even mid-resize */
  body[data-lay="phone"] #lapnav{ display:none !important; }
  #main{ padding-top:calc(var(--sat) + 4px); padding-bottom:calc(var(--tabh) + var(--addh) + var(--sab) + 8px); }
  body.v-week #main, body.v-today #main{ /* addbar shown */ }
  body:not(.v-week):not(.v-today) #main{ padding-bottom:calc(var(--tabh) + var(--sab) + 8px); }

  /* header */
  .dayhead{ padding:14px 0 8px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .dayhead .dow{ font-size:30px; font-weight:740; letter-spacing:-.02em; line-height:1; }
  .dayhead .date{ font-size:13.5px; color:var(--muted); font-weight:560; margin-top:7px; }
  .dayhead .date b{ color:var(--p); font-weight:680; }
  .streak{ flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; background:var(--paper); border:1px solid var(--hair); border-radius:22px; padding:7px 12px 7px 9px; box-shadow:var(--shadow-1); }
  .streak .ring{ width:22px;height:22px;border-radius:50%; display:grid;place-items:center; background:var(--good-wash); color:var(--good); font-size:12px; }
  .streak .num{ font-size:13px; font-weight:720; } .streak .lab{ font-size:11px; color:var(--muted); font-weight:560; margin-left:-3px; }

  .eyebrow{ font-size:10.5px; letter-spacing:.16em; font-weight:760; text-transform:uppercase; color:var(--faint); margin:18px 2px 9px; display:flex; align-items:center; gap:8px;}
  .eyebrow.p{ color:var(--p); } .eyebrow.w{ color:var(--w); }
  .eyebrow .ln{ flex:1; height:1px; background:var(--hair); }
  .eyebrow .addmini{ color:var(--muted); font-weight:680; font-size:11px; letter-spacing:.02em; text-transform:none; padding:3px 8px; border-radius:9px; }
  .eyebrow .addmini:hover{ background:var(--paper); color:var(--ink); }

  /* hero next action */
  .hero{ position:relative; background:linear-gradient(180deg,#fbeede,#f8ead9); border:1px solid var(--p-line); border-radius:20px; padding:18px 18px 16px; box-shadow:var(--shadow-2); overflow:hidden; }
  .hero::before{ content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--p); }
  .hero .lab{ font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; font-weight:780; color:var(--p); }
  .hero .row{ display:flex; align-items:flex-start; gap:14px; margin-top:11px; }
  .hero .title{ font-size:21px; font-weight:680; line-height:1.22; letter-spacing:-.01em; flex:1; padding-top:2px; }
  .hero .meta{ display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .hero.kwork{ background:linear-gradient(180deg,#eef4f5,#e6eff1); border-color:var(--w-line); }
  .hero.kwork::before{ background:var(--w); } .hero.kwork .lab{ color:var(--w); }

  .check{ flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:2.4px solid var(--p-line); background:#fff; display:grid; place-items:center; transition:transform .12s var(--ease), background .15s, border-color .15s; position:relative; }
  .check:active{ transform:scale(.86); }
  .check.big{ width:38px; height:38px; border-width:2.6px; }
  .check svg{ width:60%; height:60%; stroke:#fff; stroke-width:3.4; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:0; transform:scale(.4); transition:.18s var(--ease); }
  .row.kwork .check{ border-color:var(--w-line); }
  .t.done .check, .check.done{ background:var(--good); border-color:var(--good); }
  .t.done .check svg, .check.done svg{ opacity:1; transform:scale(1); }

  /* task card */
  .list{ display:flex; flex-direction:column; gap:8px; }
  .t{ position:relative; display:flex; align-items:center; gap:11px; background:var(--paper); border:1px solid var(--hair); border-radius:14px; padding:12px 12px 12px 13px; box-shadow:var(--shadow-1); transition:box-shadow .15s, transform .04s, opacity .2s; }
  .t::before{ content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:3px; background:var(--p); opacity:.85; }
  .t.kwork::before{ background:var(--w); }
  .t .lab{ flex:1; min-width:0; font-size:15.5px; font-weight:560; line-height:1.3; letter-spacing:-.005em; word-break:break-word; }
  .t .lab .subdesc{ display:block; font-size:11.5px; color:var(--muted); font-weight:540; margin-top:3px; }
  .t.done{ opacity:.62; } .t.done .lab{ text-decoration:line-through; text-decoration-color:var(--faint); color:var(--muted); }
  .t.dragging{ box-shadow:var(--shadow-3); transform:scale(1.015); border-color:var(--p-line); opacity:.97; z-index:30; cursor:grabbing; }
  .pill{ flex:0 0 auto; font-size:11px; font-weight:680; border-radius:8px; padding:4px 8px; white-space:nowrap; }
  .pill.time{ color:var(--w); background:var(--w-wash); border:1px solid var(--w-line); } .t.kwork .pill.time{ }
  .pill.subs{ color:var(--muted); background:var(--paper-2); border:1px solid var(--hair); display:inline-flex; gap:5px; align-items:center; }
  .pill.subs.alldone{ color:var(--good); background:var(--good-wash); border-color:#cfe3cf; }
  .chev{ flex:0 0 auto; width:24px; height:24px; display:grid; place-items:center; color:var(--faint); transition:transform .16s var(--ease); border-radius:7px; }
  .chev svg{ width:13px;height:13px; stroke:currentColor; stroke-width:2.4; fill:none; }
  .chev.open{ transform:rotate(90deg); color:var(--muted); }
  .grip{ flex:0 0 auto; width:22px; color:var(--faint); text-align:center; cursor:grab; touch-action:none; font-size:15px; letter-spacing:-1px; display:none; }
  .stuck{ flex:0 0 auto; font-size:10px; font-weight:740; color:var(--gold); background:#f6eed8; border:1px solid #ead9b3; border-radius:8px; padding:3px 7px; }

  /* subtasks */
  .subs{ margin:1px 0 2px 16px; border-left:2px solid var(--hair-2); padding:4px 0 4px 12px; display:flex; flex-direction:column; gap:6px; }
  .sub{ display:flex; align-items:center; gap:10px; background:var(--paper-2); border:1px solid var(--hair-2); border-radius:11px; padding:9px 11px; }
  .sub .lab{ flex:1; font-size:13.5px; font-weight:540; color:var(--ink-2); }
  .sub.done .lab{ text-decoration:line-through; color:var(--faint); }
  .subcheck{ flex:0 0 auto; width:21px;height:21px;border-radius:6px;border:2px solid var(--p-line);background:#fff; display:grid;place-items:center; }
  .subcheck svg{ width:62%;height:62%;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:.16s var(--ease); }
  .sub.done .subcheck{ background:var(--good); border-color:var(--good); } .sub.done .subcheck svg{ opacity:1; transform:scale(1); }
  .sub .x{ flex:0 0 auto; color:var(--faint); width:20px;height:20px; display:grid;place-items:center; font-size:15px; }
  .sub.add{ background:transparent; border:1px dashed var(--p-line); color:var(--p); font-weight:600; font-size:13px; justify-content:flex-start; gap:8px; }
  .sub.add .plus{ font-size:15px; font-weight:600; width:21px; text-align:center; }

  /* gentle helpers under today */
  .softrow{ display:flex; gap:10px; margin:16px 0 4px; flex-wrap:wrap; }
  .softbtn{ flex:1; min-width:0; background:var(--paper); border:1px solid var(--hair); border-radius:13px; padding:12px 14px; text-align:left; box-shadow:var(--shadow-1); transition:.14s; }
  .softbtn:active{ transform:scale(.99); }
  .softbtn .h{ font-size:13.5px; font-weight:660; } .softbtn .s{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .softbtn.on{ background:var(--p-wash); border-color:var(--p-line); }
  .showfull{ width:100%; margin:14px 0 2px; background:var(--paper); border:1px solid var(--hair); border-radius:13px; padding:13px; color:var(--muted); font-weight:620; font-size:13.5px; box-shadow:var(--shadow-1); display:flex; align-items:center; justify-content:center; gap:8px; }
  .showfull svg{ width:14px;height:14px;stroke:currentColor;stroke-width:2.4;fill:none; transition:transform .16s var(--ease);}
  .showfull.open svg{ transform:rotate(180deg); }

  .empty{ text-align:center; color:var(--muted); padding:34px 20px; }
  .empty .ic{ font-size:30px; opacity:.8; } .empty .h{ font-size:15px; color:var(--ink-2); font-weight:640; margin:8px 0 4px; } .empty .s{ font-size:12.5px; }

  /* day strip (phone week) */
  .daystrip{ display:flex; gap:8px; padding:6px 18px 12px; overflow-x:auto; scrollbar-width:none; scroll-snap-type:x proximity; }
  .daystrip::-webkit-scrollbar{ display:none; }
  .dp{ scroll-snap-align:center; flex:0 0 auto; width:50px; height:64px; border-radius:15px; background:var(--paper); border:1px solid var(--hair); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; box-shadow:var(--shadow-1); position:relative; }
  .dp .d{ font-size:10.5px; font-weight:680; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .dp .n{ font-size:18px; font-weight:720; }
  .dp .dots{ display:flex; gap:3px; height:5px; }
  .dp .dt{ width:5px;height:5px;border-radius:50%; } .dp .dt.p{ background:var(--p); } .dp .dt.w{ background:var(--w); }
  .dp.sel{ background:var(--ink); border-color:var(--ink); } .dp.sel .d{ color:#d8cdba; } .dp.sel .n{ color:#fff; } .dp.sel .dt.p{background:#e7a883;} .dp.sel .dt.w{background:#a9c4cd;}
  .dp.today:not(.sel){ border-color:var(--p-line); } .dp.today:not(.sel) .n{ color:var(--p); }
  .dp.fut{ width:54px; } .dp.fut .n{ font-size:20px; }

  .weekhead{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 0 4px; }
  .weekhead .rng{ font-size:19px; font-weight:720; letter-spacing:-.01em; }
  .weekhead .rng small{ font-size:11px; font-weight:680; color:#fff; background:var(--ink); padding:3px 8px; border-radius:11px; margin-left:8px; vertical-align:2px; }
  .weekhead.past .rng small{ background:var(--gold); }
  .navbtns{ display:flex; gap:6px; }
  .navbtns button{ width:36px;height:36px;border-radius:11px;background:var(--paper);border:1px solid var(--hair);display:grid;place-items:center;box-shadow:var(--shadow-1);}
  .navbtns svg{ width:15px;height:15px;stroke:var(--ink-2);stroke-width:2.4;fill:none; }
  .carry{ width:100%; margin:10px 0 2px; background:var(--gold); color:#fff; border-radius:13px; padding:13px; font-weight:680; font-size:13.5px; box-shadow:0 6px 16px rgba(183,138,58,.3); display:flex;align-items:center;justify-content:center;gap:8px; }
  .carry.zero{ background:var(--paper); color:var(--muted); box-shadow:var(--shadow-1); border:1px solid var(--hair); }

  /* swipe surface */
  #swipe{ touch-action:pan-y; }
  .dayview{ padding-top:2px; }

  /* ===== quick add (phone) ===== */
  #addbar{ position:fixed; left:0; right:0; bottom:calc(var(--tabh) + var(--sab)); z-index:40; padding:8px 14px 10px; background:linear-gradient(180deg, rgba(239,232,218,0), #ece4d2 38%); }
  body:not(.v-today):not(.v-week) #addbar{ display:none; }
  .addrow{ display:flex; gap:8px; align-items:center; max-width:680px; margin:0 auto; }
  .kindseg{ flex:0 0 auto; display:flex; background:var(--paper); border:1px solid var(--hair); border-radius:13px; overflow:hidden; box-shadow:var(--shadow-1); }
  .kindseg button{ font-size:11px; font-weight:740; padding:0 11px; height:46px; color:var(--muted); transition:.12s; letter-spacing:.01em; }
  .kindseg button.on[data-k="personal"]{ background:var(--p); color:#fff; } .kindseg button.on[data-k="work"]{ background:var(--w); color:#fff; }
  #newtask{ flex:1; min-width:0; height:46px; background:var(--paper); border:1px solid var(--hair); border-radius:14px; padding:0 15px; font-size:15px; box-shadow:var(--shadow-1); color:var(--ink); }
  #newtask:focus{ outline:none; border-color:var(--p-line); }
  .addgo{ flex:0 0 auto; width:46px; height:46px; border-radius:14px; background:var(--p); color:#fff; font-size:24px; font-weight:300; display:grid; place-items:center; box-shadow:0 6px 16px rgba(189,95,55,.34); }
  .addgo:active{ transform:scale(.94); }

  /* ===== tab bar (phone) ===== */
  #tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:50; height:calc(var(--tabh) + var(--sab)); padding-bottom:var(--sab); background:rgba(250,246,238,.86); backdrop-filter:saturate(1.4) blur(18px); -webkit-backdrop-filter:saturate(1.4) blur(18px); border-top:1px solid var(--hair); display:flex; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--faint); }
  .tab svg{ width:23px; height:23px; stroke:currentColor; stroke-width:2; fill:none; }
  .tab .tl{ font-size:10px; font-weight:640; letter-spacing:.01em; }
  .tab.on{ color:var(--p); }

  /* ===== LAPTOP ===== */
  @container app (min-width:820px){
    body{ padding:0; }
    #main{ padding:0 0 50px; }
    .wrap{ max-width:none; padding:0; }
    #lapnav{ display:flex; align-items:center; gap:14px; max-width:1640px; margin:0 auto; padding:20px 32px 8px; }
    .brand{ font-size:15px; font-weight:760; letter-spacing:-.01em; display:flex; align-items:center; gap:9px; }
    .brand .mk{ width:22px;height:22px;border-radius:7px;background:var(--p); display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800; box-shadow:0 2px 6px rgba(189,95,55,.4);}
    .lnav{ display:flex; gap:4px; margin-left:8px; background:var(--paper); border:1px solid var(--hair); border-radius:13px; padding:4px; box-shadow:var(--shadow-1); }
    .lnav button{ font-size:13px; font-weight:640; color:var(--muted); padding:8px 15px; border-radius:9px; }
    .lnav button.on{ background:var(--ink); color:#fff; }
    .lapright{ margin-left:auto; display:flex; gap:8px; align-items:center; }
    .ghost{ font-size:12.5px; font-weight:620; color:var(--muted); background:var(--paper); border:1px solid var(--hair); border-radius:11px; padding:9px 13px; box-shadow:var(--shadow-1);}
    .ghost:hover{ color:var(--ink); }
    .synced{ font-size:11.5px; color:var(--good); font-weight:600; display:flex; align-items:center; gap:6px; }
    .synced .d{ width:7px;height:7px;border-radius:50%;background:var(--good); }

    .lapwrap{ max-width:1640px; margin:0 auto; padding:8px 32px 0; }

    /* laptop today = calm centered column */
    body.v-today .lapwrap{ max-width:760px; }
    .grip{ display:block; }

    /* week grid */
    .weekhead.lap{ padding:16px 2px 14px; }
    .weekhead.lap .rng{ font-size:25px; }
    .weekgrid{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; align-items:start; }
    .weekgrid.wkend .col.fut{ grid-column:span 3; }
    .weeklabel{ display:flex; align-items:baseline; gap:9px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--ink-2); margin:18px 2px 9px; }
    .weeklabel:first-of-type{ margin-top:6px; }
    .weeklabel span{ font-size:10.5px; letter-spacing:.04em; text-transform:none; font-weight:620; color:var(--faint); }
    .col{ background:var(--paper-2); border:1px solid var(--hair); border-radius:15px; padding:10px 9px 12px; min-width:0; min-height:120px; }
    .col.today{ border-color:var(--p-line); box-shadow:0 0 0 2px var(--p-wash); background:#fbf3e8; }
    .col.fut{ background:#f4ecdb; border-color:#e7d5b6; }
    .colhead{ display:flex; align-items:baseline; gap:6px; padding:2px 3px 9px; }
    .colhead{ flex-wrap:wrap; }
    .colhead .dayhx{ margin-left:auto; display:flex; align-items:center; gap:6px; max-width:100%; }
    .colhead .hmini{ flex-wrap:nowrap; white-space:nowrap; flex:0 0 auto; }
    .colhead .dayhx .gymdot{ margin-left:0; flex:0 0 auto; }
    .hmini{ display:flex; gap:5px; align-items:flex-end; }
    .hmini .hm{ display:flex; flex-direction:column; align-items:center; line-height:1; }
    .hmini em{ font-style:normal; font-size:7px; letter-spacing:.07em; font-weight:820; color:var(--faint); }
    .hmini b{ font-size:10.5px; font-weight:760; margin-top:2.5px; letter-spacing:-.02em; }
    .hmini .hmSlp b{ color:#5b6ea8; }
    .hmini .hmCal b{ color:var(--gold); }
    .hmini .hmStp b{ color:#4e8a5a; }
    .hmini .hm.none b{ color:var(--faint); font-weight:620; }
    .hmini.smp{ opacity:.55; }
    .colhead .dw{ font-size:13px; font-weight:760; } .colhead .nn{ font-size:13px; font-weight:680; color:var(--muted); }
    .col.today .colhead .dw{ color:var(--p); } .col.fut .colhead .dw{ color:var(--gold); }
    .lanelab{ font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:760; color:var(--faint); margin:8px 2px 6px; display:flex; justify-content:space-between; align-items:center; }
    .lanelab.p{ color:var(--p); } .lanelab.w{ color:var(--w); }
    .lanelab .addmini{ font-size:14px; font-weight:600; color:var(--muted); width:18px;height:18px; border-radius:6px; display:grid;place-items:center; line-height:1; }
    .lanelab .addmini:hover{ background:var(--paper); color:var(--ink); }
    .col .list{ gap:6px; min-height:8px; }
    .col .t{ padding:8px 8px 8px 10px; gap:7px; border-radius:11px; flex-wrap:wrap; }
    .col .t .lab{ font-size:12.5px; font-weight:560; flex:1 1 100%; order:2; }
    .col .t .check{ width:20px;height:20px; order:1; } .col .t .check.big{ width:20px;height:20px; }
    .col .t .grip{ order:0; width:14px; font-size:12px; }
    .col .t .pill, .col .t .chev, .col .t .stuck{ order:3; }
    .col .t .pill{ font-size:9.5px; padding:2px 6px; } .col .t .chev{ width:18px;height:18px; }
    .col .subs{ flex:1 1 100%; order:4; margin-left:6px; }
    .col .empty{ padding:10px 4px; } .col .empty .ic{ font-size:18px;} .col .empty .h{display:none;} .col .empty .s{ font-size:10.5px; }
    .dayhead.lap{ padding:6px 2px 4px; }
    .dayhead.lap .dow{ font-size:34px; }
    .lapadd{ display:flex; gap:8px; margin:16px 0 6px; }
    .lapadd .kindseg{ height:44px;} .lapadd .kindseg button{height:44px;}

  <nav id="tabbar"></nav>
</div>
<dialog id="dlg"></dialog>

<script type="module">
/* ============================================================
   Weekly Planner — reengineered prototype
   Vanilla single-file. In-memory + localStorage (separate key,
   NEVER touches the real planner-v2.json). Seeded with real data.
   ============================================================ */

const STORE_KEY = 'wp:reeng:proto:v1';   // sandbox key — distinct from the live app's wp:concept:v2app
let UID = 1; const uid = () => 't' + (UID++);

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const isoOf = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOWFULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function mondayOf(dt){ const d=new Date(dt); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); d.setHours(0,0,0,0); return d; }
function isoMonday(dt){ const m=mondayOf(dt); return isoOf(m.getFullYear(),m.getMonth(),m.getDate()); }
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return isoOf(dt.getFullYear(),dt.getMonth(),dt.getDate()); }
function esc(s){ return (s==null?'':''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tmin(hm){ const [h,m]=hm.split(':').map(Number); return h*60+m; }

/* ---------- seed (real tasks, from your Excel via planner-seed.js) ---------- */
function T(label, kind, opts={}){ return { id:uid(), label, kind, done:!!opts.done, time:opts.time||null, subs:(opts.subs||[]).map(s=>({id:uid(),label:s,done:false})), open:false, repeat:opts.repeat||null, defers:opts.defers||0, private:!!opts.private, projectId:opts.projectId||null, remind:opts.remind||null, claude:opts.claude||null, claudeLink:opts.claudeLink||null }; }
function day(y,m,d, personal, work){ const dt=new Date(y,m,d); return { personal, work, appts:[], dow:DOW[(dt.getDay()+6)%7], n:d, month:MON[m] }; }
function emptyWeekDays(iso){ const [y,m,d]=iso.split('-').map(Number); return Array.from({length:7},(_,i)=>{ const dt=new Date(y,m-1,d+i); return { personal:[],work:[],appts:[], dow:DOW[i], n:dt.getDate(), month:MON[dt.getMonth()] }; }); }

function buildSeed(){
  // Fresh start: the CURRENT week, empty, with the standing recurring rules applied.
  // No historical sample weeks — a brand-new device begins clean and adopts the cloud copy on connect.
  const recur = [
    { day:'Mon', lane:'work', label:'Plan for Week', subs:['Outstanding actions','Priorities'] },
    { day:'Fri', lane:'work', label:'Expenses', subs:[] },
    { day:'Fri', lane:'personal', label:'Pay Credit Card', subs:[] },
  ];
  const [sy,sm,sd]=todayMonday.split('-').map(Number);
  const wk={ key:todayMonday, monday:[sy,sm-1,sd], days:emptyWeekDays(todayMonday), future:{personal:[],work:[]}, weekend:{personal:[],work:[]} };
  recur.forEach(r=>{ const di=DOW.indexOf(r.day); if(di<0) return; if(addDays(todayMonday,di)<todayISO) return; wk.days[di][r.lane].push(T(r.label, r.lane, {subs:(r.subs||[]).slice(), repeat:'weekly'})); });
  wk.days[todayDayIdx()].personal.push(T('Welcome back — tick me off to test the checkmark','personal'));
  wk.future.personal.push(T('Unscheduled tasks live here in Future','personal'));
  const db = { weeks:{ [todayMonday]:wk }, recur, inbox:[], projects:[], shopping:[], health:sampleHealth(), gym:{}, savedAt:Date.now(), v:3 };
  installDefaultProjects(db);
  return db;
}
// installs the default projects + tags matching tasks — additive, safe to run on existing data
function installDefaultProjects(db){
  if(db.projects && db.projects.length) return;
  db.projects=[
    { id:'malaga', name:'Málaga move', goal:'Build the runway to relocate the family to Málaga', due:'2026-12-01', color:'#bd5f37', pinned:true, claude:true },
    { id:'onward', name:'Onward 5-year plan', goal:'Win & deliver the Onward strategy and BMS plan', due:'2026-09-30', color:'#557785', claude:true },
  ];
  const tagAll=(pred,fn)=>{ Object.values(db.weeks||{}).forEach(wk=>{ (wk.days||[]).forEach(d=>['personal','work'].forEach(k=>(d[k]||[]).forEach(t=>{ if(pred(t))fn(t); }))); ['personal','work'].forEach(k=>((wk.future&&wk.future[k])||[]).forEach(t=>{ if(pred(t))fn(t); })); }); };
  tagAll(t=>/malaga|irish passport|starlink/i.test(t.label), t=>{ t.projectId='malaga'; });
  tagAll(t=>/onward 5 year/i.test(t.label) || t.label==='BMS proposals', t=>{ t.projectId='onward'; });


}

/* ---------- state + persistence ---------- */
let DB;
// scan every task + sub id and make sure the uid counter is past them — a stale _uid
// (the 1–2 Aug duplicate-id incident) can otherwise reissue ids that already exist
function reseedUID(db){
  let mx=0; const look=t=>{ const m=/^t(\d+)$/.exec(t.id||''); if(m) mx=Math.max(mx,+m[1]); (t.subs||[]).forEach(s=>{ const n=/^t(\d+)$/.exec(s.id||''); if(n) mx=Math.max(mx,+n[1]); }); };
  Object.values(db.weeks||{}).forEach(wk=>{ (wk.days||[]).forEach(d=>{ (d.personal||[]).forEach(look); (d.work||[]).forEach(look); }); ['future','weekend'].forEach(z=>{ if(wk&&wk[z]){ (wk[z].personal||[]).forEach(look); (wk[z].work||[]).forEach(look); } }); });
  (db.shopping||[]).forEach(look);
  UID=Math.max(UID, mx+1);
}
function loadDB(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const o=JSON.parse(raw); UID=(o._uid||1000); migrate(o); reseedUID(o); return o; } }catch(e){}
  return buildSeed();
}
// additive migration: never removes/overwrites — only fills new optional fields on older data
function migrate(db){
  if(!db.projects) db.projects=[];
  if(!db.inbox) db.inbox=[];
  if(!db.recur) db.recur=[];
  if(!db.shopping) db.shopping=[];
  if(!db.gym || typeof db.gym!=='object') db.gym={};
  if(!db.health) db.health=sampleHealth();
  if(db.health && !db.health.days) db.health.days={};
  const fix=t=>{
    if(t.id==null) t.id=uid();                 // real v2 tasks may lack ids — assign before anything references them
    if(typeof t.done!=='boolean') t.done=!!t.done;
    if(t.open===undefined) t.open=false;
    if(t.defers===undefined) t.defers=0;
    if(t.time===undefined) t.time=null;
    if(t.repeat===undefined) t.repeat=null;
    if(t.private===undefined) t.private=false;
    if(t.projectId===undefined) t.projectId=null;
    if(t.remind===undefined) t.remind=null;
    if(t.claude===undefined) t.claude=null;
    if(t.claudeLink===undefined) t.claudeLink=null;
    if(!Array.isArray(t.subs)) t.subs=[];
    t.subs=t.subs.map(s=> typeof s==='string' ? {id:uid(),label:s,done:false} : (s.id==null?(s.id=uid(),s):s));
  };
  /* repair week shape before anything reads it — legacy/partial weeks (no days, no future)
     used to crash allReminders()/countAllTasks() and blank the whole app */
  Object.entries(db.weeks||{}).forEach(([iso,wk])=>{
    if(!wk || typeof wk!=='object') return;
    if(!wk.key) wk.key=iso;
    if(!Array.isArray(wk.monday)){ const [y,m,d]=iso.split('-').map(Number); if(y&&m&&d) wk.monday=[y,m-1,d]; }
    if(!Array.isArray(wk.days)) wk.days=emptyWeekDays(iso);
    if(wk.days.length!==7){ const full=emptyWeekDays(iso); for(let i=0;i<7;i++){ if(!wk.days[i]||typeof wk.days[i]!=='object') wk.days[i]=full[i]; } wk.days.length=7; }
    { const full=emptyWeekDays(iso); wk.days.forEach((d,i)=>{ ['dow','n','month'].forEach(k=>{ if(d[k]===undefined) d[k]=full[i][k]; }); if(!Array.isArray(d.appts)) d.appts=[]; }); }
    wk.days.forEach(d=>['personal','work'].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; d[k].forEach(fix); }));
    if(!wk.future || typeof wk.future!=='object') wk.future={personal:[],work:[]};
    ['personal','work'].forEach(k=>{ if(!Array.isArray(wk.future[k])) wk.future[k]=[]; wk.future[k].forEach(fix); });
    if(!wk.weekend || typeof wk.weekend!=='object') wk.weekend={personal:[],work:[]};
    ['personal','work'].forEach(k=>{ if(!Array.isArray(wk.weekend[k])) wk.weekend[k]=[]; wk.weekend[k].forEach(fix); });
  });
  if(!db.projects.length) installDefaultProjects(db);
}
function saveDB(){ try{ DB.savedAt=Date.now(); DB._uid=UID; localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){} flashSaved(); scheduleSync(); }

const todayISO = (()=>{ const n=new Date(); return isoOf(n.getFullYear(),n.getMonth(),n.getDate()); })();
const todayMonday = isoMonday(new Date());
function todayDayIdx(){ const [y,m,d]=todayISO.split('-').map(Number); return ((new Date(y,m-1,d).getDay()+6)%7); }

const ui = {
  view: 'today',                 // today | week | projects | project | reminders | review | more
  weekKey: null,                 // current week being viewed in Week
  dayIdx: todayDayIdx(),         // selected day in phone week (0..6 or 'F')
  kind: 'personal',
  mvd: false,
  fullDay: false,
  doneToday: 0,
  projectId: null,               // open project in detail view
  claudeReview: false,           // weekly review: false | 'loading' | 'done' | 'error'
  claudeReviewText: null,
};

/* ---------- data access ---------- */
function curWeek(){ return DB.weeks[ui.weekKey]; }
function ensureWeek(iso){
  if(!DB.weeks[iso]){
    const [y,m,d]=iso.split('-').map(Number);
    DB.weeks[iso] = { key:iso, monday:[y,m-1,d], days:emptyWeekDays(iso), future:{personal:[],work:[]}, weekend:{personal:[],work:[]} };
    applyRecurring(DB.weeks[iso]);
  }
  if(!DB.weeks[iso].weekend) DB.weeks[iso].weekend={personal:[],work:[]};
  return DB.weeks[iso];
}
function daysBetween(a,b){ const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number); return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000); }
function applyRecurring(week){
  (DB.recur||[]).forEach(r=>{
    if(r.type==='interval'){
      const every=Math.max(1,+r.every||1); const anchor=r.anchor;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(anchor||'')) return;
      for(let i=0;i<7;i++){
        const iso=addDays(week.key,i);
        if(iso<anchor) continue;
        if(iso<todayISO) continue;                 // never materialise instances on days already gone
        if(daysBetween(anchor,iso)%every!==0) continue;
        const arr=week.days[i][r.lane]; if(!arr) continue;
        if(!arr.some(t=>t.label===r.label)) arr.push(T(r.label, r.lane, {subs:(r.subs||[]).slice(), repeat:'every '+every+'d'}));
      }
      return;
    }
    const di = DOW.indexOf(r.day); if(di<0) return;
    if(addDays(week.key,di)<todayISO) return;      // never materialise instances on days already gone
    const arr = week.days[di][r.lane];
    if(!arr.some(t=>t.label===r.label)) arr.push(T(r.label, r.lane, {subs:(r.subs||[]).slice(), repeat:'weekly'}));
  });
}
// re-apply recurring rules to every already-created week from startKey forward (idempotent — label-match dedupe)
function applyRecurringFrom(startKey){
  Object.keys(DB.weeks).filter(k=>k>=startKey).forEach(k=>{ const wk=DB.weeks[k]; if(wk&&Array.isArray(wk.days)) applyRecurring(wk); });
}
function colArr(week, dayIdx, kind){ return dayIdx==='F' ? week.future[kind] : dayIdx==='W' ? week.weekend[kind] : week.days[dayIdx][kind]; }

function sortTimed(arr){
  return arr.map((t,i)=>[t,i]).sort((a,b)=>{
    const at=a[0].time?0:1, bt=b[0].time?0:1; if(at!==bt) return at-bt;
    if(a[0].time&&b[0].time) return tmin(a[0].time.split('-')[0])-tmin(b[0].time.split('-')[0]);
    return a[1]-b[1];
  }).map(p=>p[0]);
}
function dayTasks(week, dayIdx){ // merged personal+work, timed-first
  const p=week.days[dayIdx].personal, w=week.days[dayIdx].work;
  return sortTimed([...p,...w]);
}

/* ============================================================
   RENDER
   ============================================================ */
const isLap = () => { const f=document.getElementById('frame'); return (f?f.clientWidth:window.innerWidth) >= 820; };
const view = document.getElementById('view');

function render(){
  document.body.className = 'v-'+ui.view;
  document.body.dataset.lay = isLap()?'lap':'phone';
  if(!ui.weekKey){ ensureWeek(todayMonday); ui.weekKey = todayMonday; }   // always open on the real current week
  renderChrome();
  if(ui.view==='today') renderToday();
  else if(ui.view==='week') renderWeek();
  else if(ui.view==='weekplus') renderWeekPlus();
  else if(ui.view==='projects') renderProjects();
  else if(ui.view==='project') renderProjectDetail(ui.projectId);
  else if(ui.view==='reminders') renderReminders();
  else if(ui.view==='shopping') renderShopping();
  else if(ui.view==='review') renderReview();
  else renderMore();
  syncAddbar();
  updateSyncBadge();
}
function viewTransition(cb){
  if(document.startViewTransition){
    const safe=()=>{ try{ cb(); }catch(err){ console.error('render failed', err); try{ flashToast('View failed to render — your data is safe'); }catch(e2){} } };
    let vt; try{ vt=document.startViewTransition(safe); }catch(e){ safe(); return; }
    // a skipped/interrupted transition rejects these promises — swallow so it never surfaces as an unhandled rejection
    try{ vt.ready&&vt.ready.then(null,()=>{}); vt.finished&&vt.finished.then(null,()=>{}); vt.updateCallbackDone&&vt.updateCallbackDone.then(null,()=>{}); }catch(e){}
  } else cb();
}
function go(v){ viewTransition(()=>{ ui.view=v; render(); }); }

/* ----- chrome: laptop nav + phone tab bar ----- */
const TABS = [
  ['today','Today','clock'],
  ['week','Week','rect'],
  ['projects','Projects','proj'],
  ['review','Review','arrow'],
  ['more','More','dots'],
];
function tabIcon(kind){
  if(kind==='week') return '<svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>';
  if(kind==='proj') return '<svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>';
  if(kind==='arrow') return '<svg viewBox="0 0 24 24"><path d="M9 5l-5 5 5 5"/><path d="M4 10h11a5 5 0 0 1 5 5v3"/></svg>';
  if(kind==='dots') return '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>';
  return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3 2"/></svg>';
}
function activeTab(){ return ui.view==='project'?'projects':(ui.view==='reminders'?'reminders':(ui.view==='weekplus'?'weekplus':ui.view)); }
function renderChrome(){
  const at=activeTab();
  document.getElementById('tabbar').innerHTML = TABS.map(t=>
    `<button class="tab ${(at===t[0]||(t[0]==='week'&&at==='weekplus'))?'on':''}" data-go="${t[0]}">${tabIcon(t[2]||t[0])}<span class="tl">${t[1]}</span></button>`).join('');
  const lap = document.getElementById('lapnav');
  if(isLap()){
    const dc=dueCount();
    const chips=[['today','Today'],['week','Week'],['weekplus','Week+'],['projects','Projects'],['reminders','Reminders'],['review','Review'],['more','More']];
    lap.innerHTML =
      `<div class="brand"><span class="mk">P</span>Planner</div>
       <div class="lnav">${chips.map(t=>`<button data-go="${t[0]}" class="${at===t[0]?'on':''}">${t[1]}${t[0]==='reminders'&&dc?`<span class="bdg">${dc}</span>`:''}</button>`).join('')}</div>
       <div class="lapright">
         <span class="synced">${(function(){var q=syncLabel();return '<span class="d" style="background:'+q.dot+'"></span>'+q.txt;})()}</span>
         <button class="ghost" data-go="shopping">🛒 Shopping</button>
         <button class="ghost" data-act="backup">⬇ Backup</button>
         <button class="ghost" data-act="excel">⬇ Excel</button>
       </div>`;
  } else lap.innerHTML='';
}

/* ----- task row (shared) ----- */
const CHK = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-11"/></svg>';
const CHEVRON = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
function taskRow(t, ctx, opts={}){
  const sc=t.subs.length, sd=t.subs.filter(s=>s.done).length;
  const sel = `data-w="${ctx.w}" data-d="${ctx.d}" data-k="${t.kind}" data-id="${t.id}"`;
  const time = t.time ? `<span class="pill time">${t.time.replace('-','–')}</span>` : '';
  const subsPill = sc ? `<span class="pill subs ${sd===sc?'alldone':''}" data-act="toggle">${sd}/${sc}</span>` : '';
  const chev = `<button class="chev ${t.open?'open':''} ${sc?'':'faint'}" data-act="toggle" aria-label="sub-tasks">${CHEVRON}</button>`;
  const stuck = t.defers>=3 ? `<span class="stuck" title="carried ${t.defers} weeks">park me?</span>` : '';
  const tag = opts.tag ? `<span class="pill subs wctag">${opts.tag}</span>` : '';
  const grip = opts.grip ? `<span class="grip" data-act="grip">⠿</span>` : '';
  let html = `<div class="t ${t.kind==='work'?'kwork':''} ${t.done?'done':''}" ${sel}>
      ${grip}
      <button class="check" data-act="check" aria-label="complete">${CHK}</button>
      <span class="lab" data-act="edit">${esc(t.label)}</span>
      ${tag}${stuck}${claudePill(t)}${remindPill(t)}${time}${subsPill}${chev}
    </div>`;
  if(t.open && sc>=0){
    const items = t.subs.map((s,j)=>`<div class="sub ${s.done?'done':''}" data-sub="${j}">
        <button class="subcheck" data-act="subcheck">${CHK}</button>
        <span class="lab">${esc(s.label)}</span>
        <button class="x" data-act="delsub">×</button></div>`).join('');
    html += `<div class="subs" ${sel}>${items}<button class="sub add" data-act="addsub"><span class="plus">+</span>Add sub-task</button></div>`;
  }
  return html;
}
function listHTML(arr, ctx, opts){
  return `<div class="list" data-w="${ctx.w}" data-d="${ctx.d}" data-k="${ctx.k}">${
    arr.map(t=>taskRow(t,{w:ctx.w,d:ctx.d},opts)).join('')}</div>`;
}

/* ----- TODAY ----- */
function renderToday(){
  const wk = ensureWeek(todayMonday);
  const wKey = wk.key, di = todayDayIdx();
  const d = wk.days[di];
  const all = dayTasks(wk, di);
  const undone = all.filter(t=>!t.done);
  const next = undone[0];
  const then = undone.slice(1, ui.mvd?3:3);
  const date = `${d.n} ${d.month}`;
  const dc=dueCount();
  const head = `<div class="dayhead ${isLap()?'lap':''}">
      <div><div class="dow">${DOWFULL[di]}</div><div class="date"><b>${date}</b> · this week</div></div>
      <div class="headright">
        <button class="gymchip ${DB.gym&&DB.gym[todayISO]?'on':''}" data-act="gym" data-date="${todayISO}">${DB.gym&&DB.gym[todayISO]?'🏋 Gym ✓':'🏋 Gym?'}</button>
        <button class="bell" data-go="reminders" aria-label="reminders"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.5 21a2 2 0 0 0 3 0"/></svg>${dc?`<span class="bdg">${dc}</span>`:''}</button>
        <div class="streak"><span class="ring">✓</span><span class="num">${ui.doneToday}</span><span class="lab">done<br>today</span></div>
      </div>
    </div>`;

  if(all.length===0){
    view.innerHTML = healthRibbonHTML() + head + dueBanner() + malagaDriverHTML() + apptsTodayHTML() + `<div class="empty"><div class="ic">☀️</div><div class="h">A clear day.</div><div class="s">Add the one thing that matters, below.</div></div>`;
    if(isLap()) view.innerHTML += lapAddRow();
    return;
  }

  let body = '';
  if(next){
    const sc=next.subs.length, sd=next.subs.filter(s=>s.done).length;
    body += `<div class="eyebrow">Your one next thing<span class="ln"></span></div>
      <div class="hero ${next.kind==='work'?'kwork':''}" data-w="${wKey}" data-d="${di}" data-id="${next.id}" data-k="${next.kind}">
        <div class="row ${next.kind==='work'?'kwork':''}">
          <button class="check big" data-act="check" data-w="${wKey}" data-d="${di}" data-id="${next.id}" data-k="${next.kind}" aria-label="complete">${CHK}</button>
          <div style="flex:1">
            <div class="lab" style="font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:780">${next.kind}</div>
            <div class="title">${esc(next.label)}</div>
          </div>
        </div>
        ${(next.time||sc)?`<div class="meta">${next.time?`<span class="pill time">${next.time.replace('-','–')}</span>`:''}${sc?`<span class="pill subs ${sd===sc?'alldone':''}">${sd}/${sc} steps</span>`:''}</div>`:''}
      </div>`;
  }
  if(then.length && !ui.fullDay){
    body += `<div class="eyebrow">Then<span class="ln"></span></div>` + listHTML(then, {w:wKey,d:di,k:'mix'}, {});
  }

  const rest = undone.slice(1+then.length);
  const doneCount = all.filter(t=>t.done).length;
  if(!ui.mvd && (rest.length || doneCount)){
    body += `<button class="showfull ${ui.fullDay?'open':''}" data-act="fullday">
        ${ui.fullDay?'Hide the rest':`Show full day · ${rest.length} more${doneCount?` · ${doneCount} done`:''}`}
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>`;
    if(ui.fullDay){
      const p=sortTimed(d.personal), w=sortTimed(d.work);
      if(p.length){ body += `<div class="eyebrow p">Personal<span class="ln"></span></div>` + listHTML(p,{w:wKey,d:di,k:'personal'},{}); }
      if(w.length){ body += `<div class="eyebrow w">Work<span class="ln"></span></div>` + listHTML(w,{w:wKey,d:di,k:'work'},{}); }
    }
  }

  // gentle controls
  body += `<div class="softrow">
      <button class="softbtn ${ui.mvd?'on':''}" data-act="mvd"><div class="h">${ui.mvd?'Minimum day · on':'Hard day?'}</div><div class="s">${ui.mvd?'Three tasks, full credit.':'Switch to 3 tasks →'}</div></button>
      <button class="softbtn" data-act="braindump"><div class="h">Brain-dump</div><div class="s">Park a thought, sort later</div></button>

function unfinishedCount(wk){

/* ============================================================

   SAFETY: pinned to the PERSONAL (consumers) account; first connect is
   READ-ONLY; backup-before-write; verify-after-write; never auto-writes

   ============================================================ */
const OD = {
  clientId:'414c9aa5-a8da-4412-83b3-9a0a9a7dd007',
  authority:'https://login.microsoftonline.com/consumers',     // consumers = personal only; work accounts are rejected at login
  scopes:'Files.ReadWrite.AppFolder offline_access openid profile',
  file:'planner-v2.json',
  graph:'https://graph.microsoft.com/v1.0',
  tokKey:'wp:od:tok', pkceKey:'wp:od:pkce', metaKey:'wp:od:meta',

(function(){ let r=location.origin+location.pathname; r=r.replace(/index\.html?$/i,''); OD.redirect=r; })();
const DEPLOY_OK = /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
const odState = { connected:false, account:'', live:false, syncing:false, pulling:false, lastSync:0, lastPull:0, etag:null, error:null, backedUp:'', expired:false };
const hhmm = ts=>{ const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };

/* ---- PKCE helpers (Web Crypto) ---- */
function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function sha256(s){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); }
function randStr(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return b64url(a.buffer); }

const CAL = {
  clientId:'eb4919ab-8577-4982-8094-23b189fab29a',
  authority:'https://login.microsoftonline.com/81492928-322d-4148-9534-8d11ac1b2f6c',  // WORK tenant — calendar only
  scopes:'Calendars.Read offline_access openid profile',
  graph:'https://graph.microsoft.com/v1.0',
  tokKey:'wp:cal:tok', pkceKey:'wp:cal:pkce', redirect:OD.redirect,
};
const calState = { connected:false, account:'', syncing:false, lastSync:0, error:null, expired:false };

async function beginAuth(cfg, stateObj, opts){
  opts=opts||{};
  if(!DEPLOY_OK){ flashToast((cfg===OD?'OneDrive':'Outlook')+' connect runs on your live GitHub Pages site'); return; }
  const verifier=randStr(48), state=randStr(16);
  localStorage.setItem(cfg.pkceKey, JSON.stringify({verifier,state}));
  const challenge=b64url(await sha256(verifier));
  const u=new URL(cfg.authority+'/oauth2/v2.0/authorize');
  u.search=new URLSearchParams({ client_id:cfg.clientId, response_type:'code', redirect_uri:cfg.redirect, response_mode:'query', scope:cfg.scopes, code_challenge:challenge, code_challenge_method:'S256', state, prompt:(opts.prompt||'select_account') }).toString();
  if(opts.login_hint){ const q=new URLSearchParams(u.search); q.set('login_hint',opts.login_hint); u.search=q.toString(); }
  location.assign(u.toString());
}
function connectOneDrive(){ return beginAuth(OD, odState); }
function connectOutlook(){ sessionStorage.removeItem('wp:cal:interactive'); return beginAuth(CAL, calState); }
/* Reconnect without the account picker where possible: prompt=none is a top-level
   round trip against the live Microsoft session, so it does not depend on third-party
   cookies and works in the iOS home-screen app too. If Microsoft says a human is
   needed, handleRedirect falls through to the normal interactive sign-in once. */
function reconnectOutlook(){
  sessionStorage.removeItem('wp:cal:interactive');
  /* Without a login_hint, Entra answers prompt=none with login_required whenever more
     than one account is live in the browser session — and there always are two here
     (personal MSA for OneDrive, work account for the calendar). Naming the account is
     what makes the silent leg actually succeed. */
  let hint='';
  try{ hint=(JSON.parse(localStorage.getItem(CAL.tokKey)||'null')||{}).account||calState.account||''; }catch(e){}
  return beginAuth(CAL, calState, {prompt:'none', login_hint:hint});
}
function cleanUrl(){ try{ history.replaceState({}, '', OD.redirect); }catch(e){} }
async function tokenRequest(cfg, extra){
  const body=new URLSearchParams(Object.assign({client_id:cfg.clientId, scope:cfg.scopes}, extra));
  const r=await fetch(cfg.authority+'/oauth2/v2.0/token',{ method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
  const j=await r.json(); if(!r.ok) throw new Error(j.error_description||j.error||('HTTP '+r.status)); return j;
}
function storeToken(cfg, stateObj, j){
  const tok={ access:j.access_token, refresh:j.refresh_token, exp:Date.now()+(j.expires_in||3600)*1000, account:stateObj.account };
  try{ if(j.id_token){ const c=JSON.parse(atob(j.id_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); tok.account=c.preferred_username||c.email||c.name||''; } }catch(e){}
  localStorage.setItem(cfg.tokKey, JSON.stringify(tok));
  stateObj.connected=true; stateObj.expired=false; stateObj.account=tok.account||stateObj.account;
}
async function handleRedirect(){
  const p=new URLSearchParams(location.search); if(!p.get('code')&&!p.get('error')) return null;
  if(p.get('error')){
    const err=p.get('error');
    // work out which connection this belonged to, rather than always blaming OneDrive
    let who=null, whoCfg=null;
    for(const pair of [[OD,odState],[CAL,calState]]){
      const blob=JSON.parse(localStorage.getItem(pair[0].pkceKey)||'null');
      if(blob && p.get('state')===blob.state){ who=pair[1]; whoCfg=pair[0]; break; }
    }
    // a silent (prompt=none) attempt that needs a human is not an error — fall straight
    // through to the interactive sign-in, once, then stop
    if(who===calState && /interaction_required|login_required|consent_required/.test(err)){
      localStorage.removeItem(CAL.pkceKey); cleanUrl();
      if(!sessionStorage.getItem('wp:cal:interactive')){ sessionStorage.setItem('wp:cal:interactive','1'); beginAuth(CAL, calState); }
      else { calState.expired=true; calState.error='Sign-in: '+(p.get('error_description')||err); }   // second failure: say why, never loop in silence
      return null;
    }
    if(who){ who.error='Sign-in: '+(p.get('error_description')||err); if(whoCfg) localStorage.removeItem(whoCfg.pkceKey); }
    else odState.error='Sign-in: '+(p.get('error_description')||err);
    cleanUrl(); return null;
  }
  let cfg=null, stateObj=null, saved=null;
  for(const pair of [[OD,odState],[CAL,calState]]){
    const blob=JSON.parse(localStorage.getItem(pair[0].pkceKey)||'null');
    if(blob && p.get('state')===blob.state){ cfg=pair[0]; stateObj=pair[1]; saved=blob; break; }
  }
  if(!cfg){ cleanUrl(); return null; }
  try{ const tok=await tokenRequest(cfg, { grant_type:'authorization_code', code:p.get('code'), redirect_uri:cfg.redirect, code_verifier:saved.verifier }); storeToken(cfg, stateObj, tok); localStorage.removeItem(cfg.pkceKey); cleanUrl(); return (cfg===OD?'od':'cal'); }
  catch(e){ stateObj.error='Sign-in failed: '+e.message; cleanUrl(); return null; }
}
async function getToken(cfg, stateObj){
  let tok=JSON.parse(localStorage.getItem(cfg.tokKey)||'null'); if(!tok) throw new Error('not connected');
  if(Date.now() > tok.exp-60000){
    if(!tok.refresh){ stateObj.expired=true; const e0=new Error('session expired — sign in again'); e0.needsSignIn=true; throw e0; }
    try{
      const j=await tokenRequest(cfg, { grant_type:'refresh_token', refresh_token:tok.refresh });
      storeToken(cfg, stateObj, j); stateObj.expired=false; tok=JSON.parse(localStorage.getItem(cfg.tokKey));
    }catch(e){
      /* Entra caps refresh tokens issued to an SPA redirect at a fixed 24h that cannot be
         extended (AADSTS700084), so the work-tenant calendar dies daily by design. Surface
         that as a plain sign-in prompt, never as a raw AADSTS string — but ONLY for a
         genuinely dead grant. A 5xx or a dropped connection must stay a normal error,
         or a flaky minute would latch the card into "signed out" and hide real faults. */
      const dead=/invalid_grant|AADSTS700084|AADSTS70008|AADSTS50173|interaction_required|expired/i.test(e.message||'');
      if(!dead) throw e;
      stateObj.expired=true;
      const err=new Error('session expired — sign in again'); err.needsSignIn=true; throw err;
    }
  }
  return tok.access;
}
async function gText(path){ const t=await getToken(OD, odState); const r=await fetch(OD.graph+path,{headers:{Authorization:'Bearer '+t}}); if(r.status===404) return null; if(!r.ok) throw new Error('read '+r.status); return r.text(); }
async function gPut(path, text){ const t=await getToken(OD, odState); const r=await fetch(OD.graph+path,{ method:'PUT', headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}, body:text }); if(!r.ok) throw new Error('write '+r.status); return r.json(); }
// merge cloud + local health rather than clobbering: a cloud copy that's newer on TASKS can still
// carry staler HEALTH — union the day maps, newer health.updatedAt side wins conflicting days
function mergeHealth(remoteH){
  if(!remoteH) return;
  const localFit = DB.health && DB.health.source==='fitbit';
  const remoteFit = remoteH.source==='fitbit';
  if(localFit && !remoteFit) return;                                   // never let sample data erase real data
  if(!localFit){ DB.health=remoteH; return; }
  const lU=+DB.health.updatedAt||0, rU=+remoteH.updatedAt||0;
  const base = lU>=rU ? (remoteH.days||{}) : (DB.health.days||{});
  const top  = lU>=rU ? (DB.health.days||{}) : (remoteH.days||{});
  DB.health = { source:'fitbit', updatedAt:Math.max(lU,rU), days:Object.assign({}, base, top) };
}
// conditional PUT: only succeeds if the cloud file still has the ETag we last saw — a 412 means
// another device wrote first, and we must NEVER blindly overwrite it (the stale-overwrite class)
async function gPutIfMatch(path, text, etag){
  const t=await getToken(OD, odState);
  const headers={Authorization:'Bearer '+t,'Content-Type':'application/json'};
  if(etag) headers['If-Match']=etag;
  const r=await fetch(OD.graph+path,{ method:'PUT', headers, body:text });
  if(r.status===412) return { conflict:true };
  if(!r.ok) throw new Error('write '+r.status);
  return r.json();
}
// item metadata only — lets the pull check cost almost nothing when nothing changed
async function odItemMeta(){
  const t=await getToken(OD, odState);
  const r=await fetch(OD.graph+APPROOT+'/'+OD.file,{headers:{Authorization:'Bearer '+t}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('meta '+r.status);
  return r.json();
}
const APPROOT='/me/drive/special/approot:';

/* ---- counts (works for BOTH old v2 and new schema) — used to assert zero-loss ---- */
function countTasksIn(db){
  let tasks=0, subs=0; const walk=arr=>{ (arr||[]).forEach(t=>{ tasks++; subs+=(t.subs||[]).length; }); };
  Object.values((db&&db.weeks)||{}).forEach(wk=>{ (wk.days||[]).forEach(d=>{ walk(d.personal); walk(d.work); }); if(wk.future){ walk(wk.future.personal); walk(wk.future.work); } if(wk.weekend){ walk(wk.weekend.personal); walk(wk.weekend.work); } });
  if(Array.isArray(db&&db.days)){ db.days.forEach(d=>{ walk(d.personal); walk(d.work); }); }   // v2 top-level active week
  if(db&&db.future){ walk(db.future.personal); walk(db.future.work); }
  return { tasks, subs };
}
function exportShape(){ return JSON.stringify({ weeks:DB.weeks, recur:DB.recur, inbox:DB.inbox, projects:DB.projects, shopping:DB.shopping, health:DB.health, gym:DB.gym||{}, savedAt:Date.now(), v:3 }); }

/* ---- reconcile: READ-ONLY look at the cloud ---- */
async function odReconcile(){
  const text=await gText(APPROOT+'/'+OD.file+':/content');
  if(text==null) return { kind:'empty' };
  let remote; try{ remote=JSON.parse(text); }catch(e){ return { kind:'corrupt' }; }
  return { kind:'exists', remote, remoteText:text, remoteCount:countTasksIn(remote), localCount:countTasksIn(DB) };
}
function odPersistMeta(){ localStorage.setItem(OD.metaKey, JSON.stringify({ live:odState.live, account:odState.account, etag:odState.etag })); }

/* ---- write: backup → conditional put → verify ---- */
let _syncRetryT=null, _syncRetryN=0;
async function odPush(){
  if(!odState.connected || !odState.live || !DEPLOY_OK) return;
  if(odState.syncing) return;
  odState.syncing=true; updateSyncBadge();
  try{
    const payload=exportShape();
    if(odState.backedUp!==todayISO){ const cur=await gText(APPROOT+'/'+OD.file+':/content'); if(cur!=null){ await gPut(APPROOT+'/backups/'+OD.file.replace('.json','')+'-'+todayISO+'.json:/content', cur); } odState.backedUp=todayISO; }
    let meta=await gPutIfMatch(APPROOT+'/'+OD.file+':/content', payload, odState.etag);
    if(meta && meta.conflict){
      // another device wrote since we last looked — decide by timestamp, never blind-overwrite
      const text=await gText(APPROOT+'/'+OD.file+':/content');
      let remote=null; try{ remote=text?JSON.parse(text):null; }catch(e){}
      if(!remote || (+remote.savedAt||0) <= (+DB.savedAt||0)){
        meta=await gPutIfMatch(APPROOT+'/'+OD.file+':/content', payload, null);   // our copy is the newer one — take over
      } else {
        odState.syncing=false; odState.error='Another device saved newer changes — review needed.'; _pushPending=false; updateSyncBadge();
        openReconcile();   // human sees both counts and chooses; the smaller-cloud discard guard applies
        return;
      }
    }
    const sent=new Blob([payload]).size;
    if(meta && typeof meta.size==='number' && Math.abs(meta.size-sent)>2) throw new Error('write not verified ('+meta.size+'≠'+sent+'B)');
    if(meta && (meta.eTag||meta['@odata.etag'])){ odState.etag=meta.eTag||meta['@odata.etag']; odPersistMeta(); }
    odState.lastSync=Date.now(); odState.error=null; _syncRetryN=0; _pushPending=false;
  }catch(e){
    odState.error='Cloud save failed — kept safe locally. '+e.message;
    if(_syncRetryN<3){ _syncRetryN++; clearTimeout(_syncRetryT); _syncRetryT=setTimeout(()=>{ if(odState.connected&&odState.live) odPush(); }, 20000*_syncRetryN); }
  }
  odState.syncing=false; updateSyncBadge();
}
/* ---- guarded auto-pull: open / focus / resume / online. Adopt silently ONLY when the cloud is
   strictly newer AND holds at least as many tasks; anything lossy goes through the reconcile
   dialog with its explicit discard warning. Costs one metadata GET when nothing changed. ---- */
async function odPullCheck(reason){
  if(!odState.connected || !odState.live || !DEPLOY_OK) return;
  if(odState.syncing || odState.pulling || dragging) return;
  if(_pushPending && _syncRetryN<3){ flushSync(); return; }                     // unsynced local change: push it first — If-Match resolves any true conflict safely.
                                                                                // After 3 straight push failures, stop starving pulls — If-Match still guards the data.
  if(typeof dlg!=='undefined' && dlg && dlg.open) return;                       // never swap data under an open dialog
  if(reason!=='init' && Date.now()-odState.lastPull<12000) return;              // throttle rapid focus flips
  odState.pulling=true;
  try{
    const meta=await odItemMeta();
    odState.lastPull=Date.now();
    if(!meta){ odState.pulling=false; return; }                                 // no cloud file yet
    if(odState.etag && meta.eTag===odState.etag){ odState.pulling=false; updateSyncBadge(); return; }  // already current — done for one cheap call
    const text=await gText(APPROOT+'/'+OD.file+':/content');
    if(text==null){ odState.pulling=false; return; }
    let remote; try{ remote=JSON.parse(text); }catch(e){ odState.pulling=false; return; }   // corrupt cloud: manual reconcile only
    const rSaved=+remote.savedAt||0, lSaved=+DB.savedAt||0;
    if(rSaved<=lSaved){ odState.etag=meta.eTag||odState.etag; odPersistMeta(); odState.pulling=false; updateSyncBadge(); return; }  // we're newest — note etag so pushes can If-Match
    const before=countTasksIn(remote).tasks;
    migrate(remote);
    const after=countTasksIn(remote).tasks;
    const localN=countTasksIn(DB).tasks;
    if(after<before || after<localN){ odState.pulling=false; openReconcile(); return; }     // would shrink — human decides
    if(dragging || (dlg&&dlg.open) || (_pushPending&&_syncRetryN<3)){ odState.pulling=false; return; }   // state changed while we were fetching — abort, try again later
    if(_pushPending){ odState.pulling=false; openReconcile(); return; }   // pushes keep failing AND the cloud moved on: genuine two-sided conflict — human decides, nothing silent
    DB.weeks=remote.weeks; DB.recur=remote.recur||DB.recur; if(remote.projects)DB.projects=remote.projects; if(remote.inbox)DB.inbox=remote.inbox; if(remote.shopping)DB.shopping=remote.shopping; mergeHealth(remote.health); if(remote.gym)DB.gym=remote.gym;
    DB.savedAt=rSaved;
    reseedUID(DB);
    odState.etag=meta.eTag||null; odPersistMeta();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign({},DB,{_uid:UID}))); }catch(e){}   // persist adoption WITHOUT scheduling an echo push
    ui.weekKey=null;                                                             // re-anchor to the current week
    render();
    flashToast('Updated from cloud ✓');
  }catch(e){ /* offline or auth hiccup — stay quiet, badge reflects connection state */ }
  odState.pulling=false; updateSyncBadge();
}

    const doAdopt=()=>{
      DB.weeks=adopted.weeks; DB.recur=adopted.recur||DB.recur; if(adopted.projects)DB.projects=adopted.projects; if(adopted.inbox)DB.inbox=adopted.inbox; if(adopted.shopping)DB.shopping=adopted.shopping; mergeHealth(adopted.health); if(adopted.gym)DB.gym=adopted.gym;

    };
    const localN=countTasksIn(DB).tasks;
    closeDialog();

      // THE 2 AUG GUARD: cloud is smaller than this device — adopting discards local-only tasks. Never silent.
      openConfirm('Cloud copy holds FEWER tasks',

        `Discard ${localN-after} & adopt cloud`, doAdopt);
    } else {
      doAdopt();
    }
  });
  dlg.querySelector('[data-x=usedevice]').addEventListener('click',async()=>{ closeDialog(); await odMakeLive(); });
}

/* ============================================================
   OUTLOOK CALENDAR  (Microsoft Graph · WORK tenant · READ-ONLY)
   Separate app + WORK account (the opposite of OneDrive). Pulls the
   −14 → +63 day window into the day/week as read-only appointments.
   Cached locally; NEVER written into the task file or to OneDrive.
   ============================================================ */
let calCache = {};
const CAL_CACHE_KEY='wp:cal:cache';
function persistCalCache(){ try{ localStorage.setItem(CAL_CACHE_KEY, JSON.stringify(calCache)); }catch(e){} }
function loadCalCache(){
  try{ const raw=localStorage.getItem(CAL_CACHE_KEY); if(raw){ calCache=JSON.parse(raw);
    // sample cache staled out (older week)? rebuild anchored to the current week
    const stale = calCache.__src==='sample' && !Object.keys(calCache).some(k=>k>=todayMonday && k!=='__src');
    if(!stale) return;
  } }catch(e){}
  calCache=buildCalSample(); persistCalCache();
}
function buildCalSample(){
  const c={ __src:'sample' };
  const add=(off,t,title,loc)=>{ const iso=addDays(todayMonday,off); (c[iso]=c[iso]||[]).push({title,time:t,loc:loc||'',allDay:false}); };
  add(0,'09:30','Weekly ops call','Teams'); add(1,'15:00','Trafford Waters BCL review','Teams');
  add(2,'11:00','Site visit — Pendle Court','Pendle Court'); add(3,'09:00','Team standup','Teams'); add(3,'16:00','COOP Live call','');
  add(4,'12:30','Lunch w/ John','');
  return c;
}
function apptsFor(iso){ const a=(calCache&&calCache[iso])||[]; return a.slice().sort((x,y)=>((y.allDay?1:0)-(x.allDay?1:0))||(''+(x.time||'')).localeCompare(''+(y.time||''))); }
function apptCard(ev){ return `<div class="appt"><span class="appt-t">${ev.allDay?'all day':esc(ev.time||'')}</span><span class="appt-l">${esc(ev.title)}${ev.loc?`<span class="appt-loc">${esc(ev.loc)}</span>`:''}</span></div>`; }
function apptsBlock(iso){ const evs=apptsFor(iso); if(!evs.length) return ''; return `<div class="appts">${evs.map(apptCard).join('')}</div>`; }
function apptsTodayHTML(){ const evs=apptsFor(todayISO); if(!evs.length) return ''; return `<div class="eyebrow w">On your calendar${calCache&&calCache.__src==='sample'?' · sample':''}<span class="ln"></span></div><div class="appts">${evs.map(apptCard).join('')}</div>`; }

async function refreshCalendar(){
  if(!calState.connected || !DEPLOY_OK) return;
  calState.syncing=true; updateSyncBadge();
  try{
    const start=addDays(todayISO,-14)+'T00:00:00', end=addDays(todayISO,63)+'T23:59:59';
    const t=await getToken(CAL, calState);
    const url=CAL.graph+'/me/calendarView?startDateTime='+start+'&endDateTime='+end+'&$select=subject,start,end,isAllDay,location&$orderby=start/dateTime&$top=250';
    const r=await fetch(url,{ headers:{ Authorization:'Bearer '+t, Prefer:'outlook.timezone="Europe/London"' } });
    const j=await r.json(); if(!r.ok) throw new Error('calendar '+r.status);
    const c={ __src:'outlook' };
    (j.value||[]).forEach(ev=>{ const s=ev.start&&ev.start.dateTime; if(!s) return; const iso=s.slice(0,10); (c[iso]=c[iso]||[]).push({ title:ev.subject||'(busy)', time:ev.isAllDay?'':s.slice(11,16), allDay:!!ev.isAllDay, loc:(ev.location&&ev.location.displayName)||'' }); });
    calCache=c; persistCalCache(); calState.lastSync=Date.now(); calState.error=null;
  }catch(e){ if(e&&e.needsSignIn){ /* the card's signed-out banner says this better; keep any specific reason already recorded */ } else { calState.error='Calendar: '+e.message; } }
  calState.syncing=false; updateSyncBadge();
}
function calDisconnect(){ localStorage.removeItem(CAL.tokKey); calState.connected=false; calState.account=''; calState.error=null; calCache=buildCalSample(); persistCalCache(); flashToast('Outlook disconnected — calendar cleared'); if(ui.view==='more') renderMore(); else render(); }

function findTask(el){
  const id=el.dataset.id||el.closest('[data-id]')?.dataset.id;
  const w=el.dataset.w||el.closest('[data-w]')?.dataset.w;
  const dRaw=el.dataset.d!==undefined?el.dataset.d:el.closest('[data-d]')?.dataset.d;
  if(id==null||w==null) return null;
  const wk=DB.weeks[w]; if(!wk) return null;
  const di = (dRaw==='F'||dRaw==='W')?dRaw:Number(dRaw);
  for(const kind of ['personal','work']){
    const arr=colArr(wk,di,kind); const idx=arr.findIndex(t=>t.id===id);
    if(idx>=0) return {wk,di,kind,arr,idx,t:arr[idx]};
  }
  return null;
}

function stepWeek(dir){
  const next=addDays(ui.weekKey, dir*7);
  ui.weekKey=next; ensureWeek(next);

function doCarry(){
  const from=curWeek(); const to=ensureWeek(todayMonday);
  let moved=0;
  from.days.forEach((d,di)=>{
    ['personal','work'].forEach(kind=>{
      for(let i=d[kind].length-1;i>=0;i--){
        const t=d[kind][i];
        if(!t.done){ t.defers=(t.defers||0)+1; to.days[di][kind].push(t); d[kind].splice(i,1); moved++; }
      }
    });
  });
  // weekend + unscheduled pool carry too — nothing gets stranded in an old week
  ['weekend','future'].forEach(zone=>{
    if(!from[zone]) return;
    ['personal','work'].forEach(kind=>{
      for(let i=from[zone][kind].length-1;i>=0;i--){
        const t=from[zone][kind][i];
        if(!t.done){ t.defers=(t.defers||0)+1; to[zone][kind].push(t); from[zone][kind].splice(i,1); moved++; }
      }
    });
  });
  saveDB();
  ui.weekKey=todayMonday;
  flashToast(`Moved ${moved} task${moved!==1?'s':''} to this week`);
  viewTransition(render);
}
// current week → next week's w/c pool (unfinished days + weekend + pool), deliberate, never automatic
function doCarryNext(){
  const from=curWeek(); const nx=addDays(from.key,7);
  const n=unfinishedCount(from); if(!n) return;
  const [ny,nm,nd]=nx.split('-').map(Number);
  openDialog(`<h3>Carry to next week?</h3><p><b>${n}</b> unfinished task${n!==1?'s':''} will move to the <b>w/c ${nd} ${MON[nm-1]}</b> Future list for Sunday sorting. Ticked tasks stay put. Nothing is deleted.</p>
    <div class="acts"><button class="cancel" data-x="no">Cancel</button><button class="save" data-x="yes">Carry ${n} forward</button></div>`);
  dlg.querySelector('[data-x=no]').addEventListener('click',closeDialog);
  dlg.querySelector('[data-x=yes]').addEventListener('click',()=>{
    closeDialog();
    const to=ensureWeek(nx); let moved=0;
    from.days.forEach(d=>{
      ['personal','work'].forEach(kind=>{
        for(let i=d[kind].length-1;i>=0;i--){ const t=d[kind][i]; if(!t.done){ t.defers=(t.defers||0)+1; to.future[kind].push(t); d[kind].splice(i,1); moved++; } }
      });
    });
    ['weekend','future'].forEach(zone=>{
      if(!from[zone]) return;
      ['personal','work'].forEach(kind=>{
        for(let i=from[zone][kind].length-1;i>=0;i--){ const t=from[zone][kind][i]; if(!t.done){ t.defers=(t.defers||0)+1; to.future[kind].push(t); from[zone][kind].splice(i,1); moved++; } }
      });
    });
    saveDB(); ui.weekKey=nx;
    flashToast(`Carried ${moved} → w/c ${nd} ${MON[nm-1]} Future — now viewing that week`);
    viewTransition(render);
  });
}
// EVERY unfinished task left in weeks before the current one — days, weekend and Future lanes.
// Display-only aggregation: nothing moves until the user acts on a task.
function pastUnfinishedAll(){
  const out=[];
  Object.keys(DB.weeks).filter(k=>k<todayMonday).sort().forEach(k=>{
    const wk=DB.weeks[k]; if(!wk||!Array.isArray(wk.days)) return;
    wk.days.forEach((d,di)=>['personal','work'].forEach(kind=>(d[kind]||[]).forEach(t=>{ if(!t.done) out.push({wk,di,kind,t}); })));
    ['future','weekend'].forEach(zone=>{ if(!wk[zone]) return; ['personal','work'].forEach(kind=>wk[zone][kind].forEach(t=>{ if(!t.done) out.push({wk,di:zone==='future'?'F':'W',kind,t}); })); });
  });
  return out;
}

function moveTask(ctx, target, baseKey){
  const {t}=ctx;
  const base = baseKey || ctx.wk.key;   // for overdue (past-week) tasks the move targets the CURRENT week, not the week they were left in
  const pos=ctx.arr.indexOf(t); if(pos<0){ closeDialog(); return; }
  if(target==='N'){
    ctx.arr.splice(pos,1);
    const nwk=ensureWeek(addDays(base,7)); t.defers=(t.defers||0)+1; nwk.future[t.kind].push(t);
  } else if(/^\d{4}-\d{2}-\d{2}$/.test(target)){
    ctx.arr.splice(pos,1);
    const wkKey=isoMonday(new Date(+target.slice(0,4), +target.slice(5,7)-1, +target.slice(8,10)));
    const wk2=ensureWeek(wkKey);
    if(wkKey>ctx.wk.key) t.defers=(t.defers||0)+1;
    wk2.days[daysBetween(wkKey,target)][t.kind].push(t);
  } else {
    const di2=(target==='F'||target==='W')?target:Number(target);
    if(base===ctx.wk.key && di2===ctx.di){ closeDialog(); return; }
    ctx.arr.splice(pos,1);
    const bwk=ensureWeek(base);
    if(base>ctx.wk.key) t.defers=(t.defers||0)+1;
    colArr(bwk,di2,t.kind).push(t);
  }
  saveDB(); closeDialog(); render(); flashToast('Moved · '+t.label.slice(0,40));
}

function whenToTarget(when){
  when=(when||'today').toLowerCase().trim();
  if(when==='future') return ['F','F'];
  if(when==='weekend') return [todayMonday, 'W'];
  if(when==='today') return [todayMonday, todayDayIdx()];
  if(when==='tomorrow'){ const iso=addDays(todayISO,1); return [isoMonday(iso), ((new Date(iso).getDay()+6)%7)]; }
  if(when==='next week') return [addDays(todayMonday,7), 'F'];
  const di=DOW.findIndex(d=>d.toLowerCase()===when.slice(0,3)); if(di>=0){ return addDays(todayMonday,di)<todayISO ? [addDays(todayMonday,7), di] : [todayMonday, di]; }   // a passed weekday means NEXT week's
  if(/^\d{4}-\d{2}-\d{2}$/.test(when)){ return [isoMonday(when), ((new Date(when).getDay()+6)%7)]; }
  return [todayMonday, todayDayIdx()];
}
function importClaude(text){
  const data=JSON.parse(text);
  if(!Array.isArray(data.tasks)) throw new Error('no "tasks" array found — expected { "tasks": [ … ] }');
  const tasks=data.tasks; let n=0;
  const findProj=v=>{ if(!v)return null; const p=(DB.projects||[]).find(x=>x.id===v||x.name.toLowerCase()===(''+v).toLowerCase()); return p?p.id:null; };
  tasks.forEach(o=>{
    let [wKey,di]=whenToTarget(o.when);
    const wk=ensureWeek(wKey==='F'?todayMonday:wKey);
    const kind=o.kind==='work'?'work':'personal';
    const arr = wKey==='F'?wk.future[kind]:colArr(wk,di,kind);
    arr.push(T(o.label, kind, {time:o.time||null, subs:(o.subs||[]), repeat:o.repeat||null, projectId:findProj(o.project), claude:o.claude||null, remind:o.remind||null}));
    n++;
  });
  return n;
}

let dragging=false;
document.addEventListener('pointerdown', e=>{
  const grip=e.target.closest('.grip'); if(!grip || !isLap()) return;
  e.preventDefault();
  const row=grip.closest('.t'); const ctx=findTask(row); if(!ctx) return;
  dragging=true; row.classList.add('dragging');
  const srcArr=ctx.arr, srcObj=ctx.t;
  function listUnder(x,y){ const el=document.elementFromPoint(x,y); if(!el)return null; const L=el.closest('.list'); return L; }
  function move(ev){
    const L=listUnder(ev.clientX,ev.clientY)||row.parentNode;
    const others=[...L.querySelectorAll('.t:not(.dragging)')];
    const after=others.find(r=>{ const b=r.getBoundingClientRect(); return ev.clientY < b.top+b.height/2; });
    if(after) L.insertBefore(row,after); else L.appendChild(row);
  }
  function up(){
    dragging=false; row.classList.remove('dragging');
    window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up);
    const tgt=row.closest('.list'); if(!tgt){ render(); return; }
    const wk=DB.weeks[tgt.dataset.w]; const di=(tgt.dataset.d==='F'||tgt.dataset.d==='W')?tgt.dataset.d:Number(tgt.dataset.d); const kind=tgt.dataset.k;
    if(!wk || !kind || !tgt.dataset.w){ render(); return; }   // dropped somewhere that isn't a real lane (e.g. the overdue list) — put it back, touch nothing
    // if a cloud adoption swapped the data out mid-drag, our captured task object is stale — inserting it would resurrect a duplicate
    const still=findTask(row); if(!still || still.t!==srcObj){ render(); return; }
    const sPos=srcArr.indexOf(srcObj); if(sPos>=0) srcArr.splice(sPos,1);
    // moving lanes/days changes kind to the target lane
    if(srcObj.kind!==kind) srcObj.kind=kind;
    if(wk && ctx.wk && wk.key>ctx.wk.key) srcObj.defers=(srcObj.defers||0)+1;   // cross-week drag counts as a defer, same as every other move route
    const tgtArr=colArr(wk,di,kind);
    let newIdx=[...tgt.querySelectorAll('.t')].indexOf(row); if(newIdx<0)newIdx=tgtArr.length;
    // account for timed-sort: just push then sort handled on render
    tgtArr.splice(newIdx,0,srcObj);
    saveDB(); render();
  }
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
});

/* relayout on breakpoint cross — multiple triggers so the swap is always reliable */
let _wasLap=null;
function relayoutIfCrossed(){ const n=isLap(); if(n!==_wasLap){ _wasLap=n; render(); } }
function watchLayout(){
  _wasLap=isLap();
  // matchMedia fires reliably on real viewport breakpoint crossings (drag-resize)
  try{ const mq=matchMedia('(min-width:820px)'); mq.addEventListener? mq.addEventListener('change',relayoutIfCrossed) : mq.addListener(relayoutIfCrossed); }catch(e){}
  // debounced resize backup
  let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(relayoutIfCrossed,140); });
  // ResizeObserver on #frame (covers container-width changes; harmless if it never fires)
  const f=document.getElementById('frame'); if(f && 'ResizeObserver' in window){ try{ new ResizeObserver(relayoutIfCrossed).observe(f); }catch(e){} }
}

/* ============================================================
   CLAUDE BACKEND — the app talks to Claude directly.
   In this design lab: window.claude.complete (built in, no key).
   On the live site: a ~20-line Cloudflare worker (same pattern as the
   Fitbit proxy) holds the API key — set CLAUDE_PROXY_URL and nothing
   else changes. All features are on-demand and CONFIRM-BEFORE-WRITE:
   Claude proposes, only you apply. A failure never breaks the planner.
   ============================================================ */
const CLAUDE_PROXY_URL='';   // e.g. 'https://claude-proxy.tom-f71.workers.dev' once deployed
function claudeBackend(){ if(window.claude && window.claude.complete) return 'lab'; if(CLAUDE_PROXY_URL) return 'worker'; return null; }
async function askClaude(system, user, maxTokens){
  const be=claudeBackend(); if(!be) throw new Error('no Claude backend configured');
  if(be==='lab') return await window.claude.complete({ system, messages:[{role:'user',content:user}], max_tokens:maxTokens||800 });
  const r=await fetch(CLAUDE_PROXY_URL,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ system, user, max_tokens:maxTokens||800 }) });
  if(!r.ok) throw new Error('Claude proxy '+r.status);
  const j=await r.json(); return j.text||j.completion||'';
}
function extractJSON(s){ const m=(''+s).match(/\{[\s\S]*\}/); if(!m) throw new Error('no JSON in reply'); return JSON.parse(m[0]); }
function mdLite(s){
  // escape first, then convert the markdown models emit anyway: **b**, *i*, `c`, # headers, - bullets
  let h=esc((''+s).trim());
  h=h.replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>');
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/__([^_\n]+)__/g,'<b>$1</b>');
  h=h.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>').replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g,'$1<i>$2</i>');
  h=h.replace(/`([^`\n]+)`/g,'$1');
  h=h.replace(/^\s*[-•]\s+/gm,'· ');
  h=h.replace(/\*/g,'');  // any stragglers
  return h;
}

    }catch(e){

    if(changed) saveDB();                                                  // health data syncs to the phone through OneDrive — no phone-side Fitbit login needed
